---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Renders the whole Flux tree offline with flate (the maintained successor to
# flux-local, which is sunset): every Kustomization AND every HelmRelease is
# templated, so a bad chart value fails here instead of on the cluster. The
# diff job posts what actually changes in the rendered output.
name: "Flux Diff"

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-render:
    name: Flux Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install flate
        uses: home-operations/flate/action@v0.6.5
        with:
          cache: "true"

      # SOPS-encrypted Secrets cannot be decrypted here; flate replaces their
      # values with placeholders. HelmRelease valuesFrom Secrets that only
      # exist in-cluster (ExternalSecret products) are skipped, everything
      # else must render.
      - name: Render every Kustomization and HelmRelease
        run: flate test all --path kubernetes --allow-missing-kinds Secret

  flux-diff:
    name: Flux Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install flate
        uses: home-operations/flate/action@v0.6.5
        with:
          cache: "true"
          base: origin/${{ github.event.repository.default_branch }}

      - name: Diff rendered resources against the default branch
        id: diff
        run: |
          flate diff all --path kubernetes \
            --allow-missing-kinds Secret \
            --strip-attr helm.sh/chart \
            --strip-attr checksum/config \
            --strip-attr app.kubernetes.io/version \
            --strip-attr chart \
            -o github > diff.md
          echo "size=$(wc -c < diff.md)" >> "$GITHUB_OUTPUT"

      # The PR comment is capped at 50 KB; the artifact keeps the whole
      # rendered diff so large chart bumps stay reviewable
      # (`gh run download <run-id> -n flux-diff`).
      - name: Upload full diff
        if: steps.diff.outputs.size != '0'
        uses: actions/upload-artifact@v7
        with:
          name: flux-diff
          path: diff.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Trim comment
        id: comment
        if: steps.diff.outputs.size != '0'
        run: |
          MAX_SIZE=50000
          {
            echo "body<<EOF"
            if [ "${{ steps.diff.outputs.size }}" -gt "$MAX_SIZE" ]; then
              echo "⚠️ **Diff truncated** (${{ steps.diff.outputs.size }} bytes). Full diff: artifact \`flux-diff\` on ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo ""
              head -c "$MAX_SIZE" diff.md
              echo ""
              echo "... (truncated)"
            else
              cat diff.md
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add comment
        if: steps.diff.outputs.size != '0'
        uses: mshick/add-pr-comment@v3
        with:
          message-id: "${{ github.event.pull_request.number }}/flux-diff"
          message-failure: Diff was not successful
          message: ${{ steps.comment.outputs.body }}
