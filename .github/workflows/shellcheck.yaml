---
# Gate at -S warning: the repo is clean at that level. Info/style findings
# (mostly SC2086 unquoted args in scripts/amcrest.sh) are left un-gated so this
# lands green and stays meaningful.
name: ShellCheck
on:
  pull_request:
    paths:
      - "scripts/**.sh"
      - ".devcontainer/**.sh"
      - ".github/workflows/shellcheck.yaml"
  push:
    branches: ["main"]
    paths:
      - "scripts/**.sh"
      - ".devcontainer/**.sh"

# A Renovate rebase supersedes the previous run on the same PR; cancel it
# instead of queueing both. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: shellcheck -S warning -f gcc scripts/*.sh .devcontainer/*.sh
