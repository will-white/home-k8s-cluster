---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "SOPS Encryption Check"

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]
  push:
    branches: ["main"]
    paths: ["kubernetes/**"]

permissions:
  contents: read

# A Renovate rebase supersedes the previous run on the same PR; cancel it
# instead of queueing both. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sops-check:
    name: SOPS Encryption Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify all Secret manifests are SOPS-encrypted
        run: bash ./scripts/sops-check.sh kubernetes
