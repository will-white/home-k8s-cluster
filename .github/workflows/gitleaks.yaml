---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Gitleaks"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Weekly full-history scan
    - cron: "0 6 * * 1"

permissions:
  contents: read
  # Required to write SARIF results to the Security tab
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history required: gitleaks-action diffs PRs as `base^..head`,
          # so the base commit (and its parent) must be present in the clone.
          # A shallow (depth 1) checkout omits it and the scan fails with
          # "unknown revision or path not in the working tree".
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
