---
# Enforced yamllint — unlike the old copy buried in agent-validation.yml
# (continue-on-error), this one fails the build.
name: YAML Lint
on:
  pull_request:
    paths:
      - "kubernetes/**.yaml"
      - ".taskfiles/**"
      - "Taskfile.yaml"
      - ".yamllint.yaml"
  push:
    branches: ["main"]
    paths:
      - "kubernetes/**.yaml"

# A Renovate rebase supersedes the previous run on the same PR; cancel it
# instead of queueing both. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        # apt, not pipx — the ARC runner image has no python toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yamllint
      - name: Lint
        run: yamllint -f github kubernetes/ .taskfiles/ Taskfile.yaml
