---
# CNPG barman WAL archiving and base backups to the Rook-Ceph RGW.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-rgw
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: shibari-platform-db
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
      ports:
        - port: 80
          protocol: TCP
        - port: 8080
          protocol: TCP
