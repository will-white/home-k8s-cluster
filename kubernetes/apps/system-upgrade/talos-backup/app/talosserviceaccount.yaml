---
# Talos-side ServiceAccount: the Talos API access feature
# (patches/controller/api-access.yaml) allows os:admin from the
# system-upgrade namespace only. This CRD makes Talos materialize a
# Kubernetes Secret of the same name containing a short-lived talosconfig.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
spec:
  roles:
    - os:admin
