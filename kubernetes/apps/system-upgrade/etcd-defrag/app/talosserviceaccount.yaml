---
# Talos-side ServiceAccount; Talos materializes a Secret of the same name
# holding a short-lived talosconfig. EtcdDefragment needs os:operator or
# os:admin, but the Talos API access feature (patches/controller/api-access.yaml)
# only allows os:admin today. Narrow this to os:operator once that patch adds
# it to allowedRoles (needs a machine-config apply on the control planes).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag-secrets
spec:
  roles:
    - os:admin
