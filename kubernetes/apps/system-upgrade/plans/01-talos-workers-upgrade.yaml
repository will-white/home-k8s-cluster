---
# yaml-language-server: $schema=https://raw.githubusercontent.com/rancher/system-upgrade-controller/master/pkg/apis/upgrade.cattle.io/v1/plan.json
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: talos-workers
  namespace: system-upgrade
spec:
  version: v1.13.0
  serviceAccountName: system-upgrade
  concurrency: 1
  exclusive: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
  upgrade:
    image: ghcr.io/siderolabs/installer:v1.13.8@sha256:1c6a41e8324d85742ba97968c427a10122a47273244c209e5dd2d4b207516e7d
  drain:
    force: true
    disableEviction: true
    deleteLocalData: true
    ignoreDaemonSets: true
    skipWaitForDeleteTimeout: 120
    timeout: 600
    gracePeriod: 900
