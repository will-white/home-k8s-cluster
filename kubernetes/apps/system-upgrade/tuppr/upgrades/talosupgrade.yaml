---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
    version: v1.14.6
  policy:
    rebootMode: powercycle
    # Never let the upgrade Job land on the node it is upgrading. The default
    # is `soft` — "prefers to avoid but CAN run on the target node" — and when
    # it does, tuppr's own cordon/drain evicts the Job mid-flight and the
    # upgrade fails with the node left at its old version.
    #
    # This bit us on the v1.13.0 -> v1.13.8 roll: mj04ew44 failed with
    # "Upgrade Job failed while node remained at v1.13.0", which stopped the
    # batch after 3 of 8 nodes and left the node cordoned with its OSD
    # evicted (Ceph degraded until manually uncordoned).
    #
    # `hard` makes avoidance a scheduling requirement. With 8 nodes there is
    # always somewhere else to run.
    placement: hard
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    # Wait for Ceph to settle between nodes: a rebooted node's OSD shows up
    # as OSD_DOWN / PG_DEGRADED, which keeps this false until it re-peers.
    #
    # HEALTH_WARN passes only when every listed check is on the allowlist:
    # - BLUESTORE_SLOW_OP_ALERT: a slow disk (osd.5 on mj04ew44, 2026-11),
    #   not a failure. It lingers for bluestore_slow_ops_warn_lifetime (1h)
    #   and would otherwise stall the roll.
    # - AUTH_*: muted cluster-wide but still listed in status.ceph.details.
    # Any other check (OSD down, degraded/undersized PGs, mon down…) blocks.
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health == 'HEALTH_OK' ||
        (status.ceph.health == 'HEALTH_WARN' &&
          has(status.ceph.details) &&
          status.ceph.details.all(k, k in [
            'BLUESTORE_SLOW_OP_ALERT',
            'AUTH_EMERGENCY_CIPHERS_SET',
            'AUTH_INSECURE_CLIENT_KEY_TYPE',
            'AUTH_INSECURE_KEYS_ALLOWED',
            'AUTH_INSECURE_KEYS_CREATABLE'
          ]))
    # Refuse to start the next node if any node is not Ready (catches the
    # case where a previous upgrade left a node unreachable).
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
