---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    # Same gate as talosupgrade.yaml: HEALTH_WARN passes only when every
    # listed check is on the allowlist. BLUESTORE_SLOW_OP_ALERT is osd.5's
    # slow disk (mj04ew44, 2026-11); the AUTH_* checks are muted cluster-wide
    # but still listed in status.ceph.details. Anything else blocks.
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health == 'HEALTH_OK' ||
        (status.ceph.health == 'HEALTH_WARN' &&
          has(status.ceph.details) &&
          status.ceph.details.all(k, k in [
            'BLUESTORE_SLOW_OP_ALERT',
            'AUTH_EMERGENCY_CIPHERS_SET',
            'AUTH_INSECURE_CLIENT_KEY_TYPE',
            'AUTH_INSECURE_KEYS_ALLOWED',
            'AUTH_INSECURE_KEYS_CREATABLE'
          ]))
    # Refuse to start the next node if any node is not Ready.
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
