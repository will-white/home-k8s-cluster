---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app adguard-dns-external
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    disableSchemaValidation: true # Ref: https://github.com/kubernetes-sigs/external-dns/issues/5206
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    disableSchemaValidation: true # Ref: https://github.com/kubernetes-sigs/external-dns/issues/5206
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    domainFilters: ["${SECRET_DOMAIN}"]
    env: []
    extraArgs:
      - --gateway-name=external
      - --gateway-namespace=network
      - --managed-record-types=A
      - --managed-record-types=AAAA
      - --managed-record-types=TXT
      - --managed-record-types=SRV
      # LB address of the external Cilium Gateway (see cilium-gateway/app/gateway.yaml).
      - --default-targets=192.168.110.48
      - --force-default-targets
      # external-dns 0.22 switched the default annotation prefix to
      # external-dns.kubernetes.io/ with no fallback; every ingress here uses
      # the alpha prefix. Without this, 0.22 ignores target annotations and
      # deletes records (tunnel CNAMEs were lost once, see #1381/#1402).
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
    logLevel: debug
    podAnnotations:
      secret.reloader.stakater.com/reload: adguard-dns-secret
    policy: sync
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0@sha256:a119f729b16d435769aefcd9d4be149d4be7142848439bafd45e4045aa0b2e4e
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        env:
          - name: LOG_LEVEL
            value: debug
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_URL
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_USER
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_PASSWORD
          - name: DRY_RUN
            value: "false"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
    registry: txt
    # No `service` source: --gateway-name does not filter Services, and with
    # --force-default-targets this instance rewrote every annotated
    # LoadBalancer Service to the external gateway IP. On a NEW name it raced
    # adguard-dns-internal and AdGuard answered with the wrong IP (tdarr-server
    # -> .48, #1563); the two then deleted/re-added each other's rule every
    # minute. All Service records are owned by adguard-dns-internal
    # (owner=default), which keeps the `service` source.
    sources:
      - gateway-httproute
    triggerLoopOnEvent: true
    txtOwnerId: external
    txtPrefix: k8s-ext.
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  driftDetection:
    mode: enabled
