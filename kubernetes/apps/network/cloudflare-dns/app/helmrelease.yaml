---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    disableSchemaValidation: true # Ref: https://github.com/kubernetes-sigs/external-dns/issues/5206
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    disableSchemaValidation: true # Ref: https://github.com/kubernetes-sigs/external-dns/issues/5206
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-dns-secret
            key: api-token
    extraArgs:
      # Only routes attached to the external Gateway get public records; the
      # CNAME target comes from the Gateway's external-dns target annotation.
      - --gateway-name=external
      - --gateway-namespace=network
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      # external-dns 0.22 switched the default annotation prefix to
      # external-dns.kubernetes.io/ with no fallback; every ingress here uses
      # the alpha prefix (now on the external Gateway). Without this, 0.22 ignores target annotations and
      # deletes records (tunnel CNAMEs were lost once, see #1381/#1402).
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
      # DNSEndpoints labelled for AdGuard hold LAN-only records. --label-filter
      # applies to every source (HTTPRoutes too), so it must stay a negative
      # selector: unlabelled routes and the tunnel DNSEndpoint still match.
      - --label-filter=dns.home.arpa/target!=adguard
      # Fail-closed backstop: a private address never belongs in public DNS,
      # whatever a future DNSEndpoint is (or isn't) labelled.
      - --exclude-target-net=10.0.0.0/8
      - --exclude-target-net=172.16.0.0/12
      - --exclude-target-net=192.168.0.0/16
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: cloudflare-dns-secret
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  driftDetection:
    mode: enabled
