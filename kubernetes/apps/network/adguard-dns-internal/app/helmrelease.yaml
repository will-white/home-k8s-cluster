---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app adguard-dns-internal
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    disableSchemaValidation: true # Ref: https://github.com/kubernetes-sigs/external-dns/issues/5206
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    disableSchemaValidation: true # Ref: https://github.com/kubernetes-sigs/external-dns/issues/5206
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    domainFilters: ["${SECRET_DOMAIN}"]
    env: [] # Clear any existing env vars from previous Cloudflare config
    extraArgs:
      # Routes on the internal Gateway resolve to its LB address (Gateway status).
      - --gateway-name=internal
      - --gateway-namespace=network
      - --managed-record-types=A
      - --managed-record-types=AAAA
      - --managed-record-types=TXT
      - --managed-record-types=SRV
      # external-dns 0.22 switched the default annotation prefix to
      # external-dns.kubernetes.io/ with no fallback; every ingress here uses
      # the alpha prefix. Without this, 0.22 ignores target annotations and
      # deletes records (tunnel CNAMEs were lost once, see #1381/#1402).
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
    extraContainers:
      - name: adguard-sidecar
        image: ghcr.io/will-white/adguard-external-dns-sidecar:v0.4.0@sha256:a7f0598befd0d703691cf41736587356d3a76728d746f58cc29dca66db24949a
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
              - ALL
        # /healthz fails while AdGuard is unreachable, so as a liveness probe it
        # restart-looped the sidecar; /readyz only checks the process is up.
        livenessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
          - name: HEALTH_PORT
            value: "8081"
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_URL
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_USER
          - name: ADGUARD_PASS
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_PASSWORD
          - name: ROOT_DOMAIN
            value: "${SECRET_DOMAIN}"
          - name: FALLBACK_IP
            value: "192.168.5.1"
          - name: CHECK_INTERVAL
            value: "60"
          # No catch-all: AdGuard answers with the union of every matching rewrite,
          # so a wildcard to the router also answered for LoadBalancer Services and
          # off-cluster hosts, giving them two addresses. Router-served (Caddy) names
          # are listed explicitly instead; anything undeclared resolves upstream.
          - name: WILDCARD_FALLBACK
            value: "false"
          - name: STATIC_RECORDS
            value: >-
              nas=192.168.5.1,opnsense=192.168.5.1,plex=192.168.5.1,
              portainer=192.168.5.1,netboot=192.168.5.1,konnected=192.168.5.1,
              pikvm=192.168.5.1,s3=192.168.5.1,weather=192.168.5.1,
              adguard=192.168.5.2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
    logLevel: debug
    podAnnotations:
      secret.reloader.stakater.com/reload: adguard-dns-secret
    policy: sync
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0@sha256:a119f729b16d435769aefcd9d4be149d4be7142848439bafd45e4045aa0b2e4e
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        env:
          - name: LOG_LEVEL
            value: debug
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_URL
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_USER
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-dns-secret
                key: ADGUARD_PASSWORD
          - name: DRY_RUN
            value: "false"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
    # The adguard-sidecar still lists Ingresses on every check; since `ingress`
    # left `sources` the chart no longer grants that, the sidecar gets a 403 and
    # never turns ready, and every upgrade times out and rolls back.
    rbac:
      additionalPermissions:
        - apiGroups: ["networking.k8s.io"]
          resources: ["ingresses"]
          verbs: ["get", "list", "watch"]
    registry: txt
    sources:
      - gateway-httproute
      - service
    triggerLoopOnEvent: true
    txtOwnerId: default
    txtPrefix: k8s.
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  driftDetection:
    mode: enabled
