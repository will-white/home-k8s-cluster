---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Gateway API standard channel, v1.6.1.
#
# Cilium 1.20's operator requires gatewayclasses, gateways, httproutes,
# grpcroutes, tlsroutes, referencegrants and backendtlspolicies to all serve
# gateway.networking.k8s.io/v1. If any is missing it does NOT crash — it logs
# "Required GatewayAPI resources are not found" and disables the Gateway API
# controller for the life of the process, which silently stops Gateway/HTTPRoute
# reconciliation and the cert sync into cilium-secrets.
#
# v1.6.1 referencegrants still serves v1beta1 as the storage version, so this
# set satisfies Cilium 1.19 as well and is safe to land ahead of the 1.20 bump.
#
# grpcroutes was present in-cluster but missing here (drift); tlsroutes moved
# from the experimental channel to standard.
#
# CRDs are vendored under vendor/ (from the URLs below with vendor.sh) rather
# than fetched from raw.githubusercontent.com at reconcile time: the remote
# fetch has failed before (see the lookup exclusion in the flux-system Alert),
# and bootstrap's apps task applies this same kustomization before Cilium
# starts, which must work without GitHub reachability.
resources:
  - vendor/gateway.networking.k8s.io_gatewayclasses.yaml
  - vendor/gateway.networking.k8s.io_gateways.yaml
  - vendor/gateway.networking.k8s.io_httproutes.yaml
  - vendor/gateway.networking.k8s.io_grpcroutes.yaml
  - vendor/gateway.networking.k8s.io_referencegrants.yaml
  - vendor/gateway.networking.k8s.io_backendtlspolicies.yaml
  - vendor/gateway.networking.k8s.io_tlsroutes.yaml
