---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  annotations:
    # 192.168.5.46 was ingress-nginx-internal's address; it is free to reclaim
    # in a follow-up now that ingress-nginx is gone (swap here and in
    # infrastructure.annotations below, then let external-dns re-point AdGuard).
    lbipam.cilium.io/ips: "192.168.5.49"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-gateway-tls"
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.5.49"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  annotations:
    # 192.168.5.48 was ingress-nginx-external's address; free to reclaim in a
    # follow-up (also update --default-targets in adguard-dns-external).
    lbipam.cilium.io/ips: "192.168.5.44"
    # external-dns reads the target from the Gateway, not from HTTPRoutes:
    # every route attached here gets a Cloudflare CNAME to the tunnel.
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-gateway-tls"
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.5.44"
