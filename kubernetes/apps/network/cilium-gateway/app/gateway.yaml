---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  annotations:
    # ingress-nginx-internal's old address, reclaimed after its Service was
    # pruned. Keep in sync with infrastructure.annotations below; external-dns
    # re-points the AdGuard records from the Gateway status address.
    lbipam.cilium.io/ips: "192.168.5.46"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-gateway-tls"
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.5.46"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  annotations:
    # ingress-nginx-external's old address, reclaimed after its Service was
    # pruned. adguard-dns-external --default-targets must match.
    lbipam.cilium.io/ips: "192.168.5.48"
    # external-dns reads the target from the Gateway, not from HTTPRoutes:
    # every route attached here gets a Cloudflare CNAME to the tunnel.
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-gateway-tls"
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.5.48"
