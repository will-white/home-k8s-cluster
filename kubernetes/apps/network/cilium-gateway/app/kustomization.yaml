---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./gatewayclass.yaml
  - ./gateway.yaml
  - ./httproute-redirect.yaml
configMapGenerator:
  - name: cilium-gateway-loki-rules
    files:
      - cilium-gateway.yaml=./resources/lokirule.yaml
    options:
      labels:
        loki_rule: "true"
generatorOptions:
  disableNameSuffixHash: true
