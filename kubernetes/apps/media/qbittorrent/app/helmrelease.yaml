---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  # Longer timeout: gluetun must establish the VPN tunnel before qBittorrent's
  # WebUI (and thus the readiness probe) can pass.
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # No rollback: a failed upgrade must NOT revert to the previous (leaky)
    # release. Leave the new pod in place so its logs are observable.
    remediation:
      retries: 0
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            env:
              PUID: 1000
              PGID: 1000
              TZ: ${TIMEZONE}
              QBT_WEBUI_PORT: &port 80
              QBT_TORRENTING_PORT: 50413
            #   CROSS_SEED_ENABLED: false
            #   CROSS_SEED_HOST: cross-seed.default.svc.cluster.local
            #   CROSS_SEED_PORT: 80
            #   CROSS_SEED_SLEEP_INTERVAL: 0
            #   PUSHOVER_ENABLED: true
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            # Request follows the 7-day peak (3078Mi); the 6Gi limit stays
            # generous on purpose — qBittorrent's memory grows over uptime.
            resources:
              requests:
                cpu: 100m
                memory: 3Gi
              limits:
                memory: 6Gi
          exporter:
            image:
              repository: ghcr.io/esanchezm/prometheus-qbittorrent-exporter
              tag: v1.8.0@sha256:f27cc3b38a7383353ccdd8517f6b57187cc90ad9e6504049630c25e111f590e9
            env:
              QBITTORRENT_PORT: &port 80
              QBITTORRENT_HOST: localhost
              EXPORTER_PORT: &metricsPort 9707
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
          # Plex- and gaming-aware upload limit (resources/upload-throttle.sh):
          # low while anyone streams remotely or games, higher otherwise. The
          # router's FQ-CoDel shaper can't prioritise inside the one VPN flow.
          upload-throttle:
            image:
              repository: docker.io/alpine/k8s
              tag: 1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
            command: ["/bin/bash", "/scripts/upload-throttle.sh"]
            env:
              UP_LIMIT_IDLE: "2097152"       # 2 MiB/s (~17 of the 36 Mbit/s uplink)
              UP_LIMIT_STREAMING: "204800"   # 200 KiB/s while streaming remotely
              UP_LIMIT_GAMING: "204800"      # 200 KiB/s while gaming
              # Watched by MAC (ARP/NDP follow DHCP and IPv6 privacy addresses).
              # wings-01 carries the hosted game servers' players through the
              # VPS WireGuard tunnel, which idles at ~15-18 pkt/s, hence @50.
              GAMING_HOSTS: "main-pc=10:ff:e0:ac:04:ea wings-01=bc:24:11:44:4d:93@50"
              GAMING_PPS: "30"
              GAMING_HOLD: "180"
              INTERVAL: "20"
            envFrom:
              - secretRef:
                  name: qbittorrent-throttle-secret
              # Read-only OPNsense API user qbt-gaming-detector (pfTop, ARP,
              # NDP). Optional: without it gaming detection is skipped.
              - secretRef:
                  name: qbittorrent-opnsense-secret
                  optional: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
        initContainers:
          # VPN sidecar: all pod traffic egresses through PIA OpenVPN with a
          # kill switch. If the tunnel drops, gluetun's firewall blocks egress so
          # the real IP cannot leak (TCP *and* UDP). qBittorrent's own SOCKS5 proxy
          # must be turned OFF in the WebUI once this is live.
          # Native sidecar (init container with restartPolicy: Always): kubelet
          # starts it first and holds the app containers until its startup probe
          # (gluetun's own healthcheck = tunnel up) passes. As a regular container
          # it started in parallel and qBittorrent briefly egressed without the VPN.
          gluetun:
            restartPolicy: Always
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              VPN_SERVICE_PROVIDER: private internet access
              # gluetun does NOT support PIA over WireGuard — only OpenVPN. PIA
              # OpenVPN uses the same OPENVPN_USER/OPENVPN_PASSWORD account creds.
              VPN_TYPE: openvpn
              OPENVPN_PROTOCOL: udp
              # PIA US regions do NOT support port forwarding, and without a
              # forwarded port peers cannot connect in, so seeding barely works.
              # CA Vancouver is the closest PF-capable region to Denver (others:
              # CA Toronto, CA Montreal, CA Ontario, Mexico).
              SERVER_REGIONS: "CA Vancouver"
              PORT_FORWARD_ONLY: "true"
              VPN_PORT_FORWARDING: "on"
              # Push the forwarded port to qBittorrent (WebUI on :80, localhost
              # auth bypass on) and bind it to the tunnel. The down command
              # resets the port so qBittorrent re-binds after a reconnect
              # (qBittorrent bug; see gluetun wiki vpn-port-forwarding.md).
              # {{ "{{PORT}}" }} escapes the placeholders from app-template's tpl pass.
              VPN_PORT_FORWARDING_UP_COMMAND: >-
                /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
                "json={\"listen_port\":{{ "{{PORT}}" }},\"current_network_interface\":\"{{ "{{VPN_INTERFACE}}" }}\",\"random_port\":false,\"upnp\":false}"
                http://127.0.0.1:80/api/v2/app/setPreferences'
              VPN_PORT_FORWARDING_DOWN_COMMAND: >-
                /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
                "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
                http://127.0.0.1:80/api/v2/app/setPreferences'
              # Open the WebUI (80) and metrics (9707) ports through the kill-switch
              # firewall so the Service/probes can still reach the pod.
              FIREWALL_INPUT_PORTS: "80,9707"
              # Allow direct (non-VPN) access to in-cluster + LAN ranges so DNS,
              # the Service, kubelet probes, and the NFS server keep working.
              FIREWALL_OUTBOUND_SUBNETS: "10.69.0.0/16,10.96.0.0/16,192.168.5.0/24"
              # DNS left at gluetun default (DNS-over-TLS through the tunnel) to
              # avoid DNS leaks.
              UPDATER_PERIOD: 24h
              TZ: ${TIMEZONE}
            # OPENVPN_USER / OPENVPN_PASSWORD (PIA account creds) come from the
            # SOPS-encrypted secret.sops.yaml in this directory.
            envFrom:
              - secretRef:
                  name: qbittorrent-vpn-secret
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              # Keep the default capability set — gluetun and the openvpn process
              # need CHOWN/SETUID/SETGID/DAC_OVERRIDE to write the config and drop
              # privileges — and add NET_ADMIN for tunnel/route management. Do NOT
              # drop: ALL here (that broke chown of the ovpn config).
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              # gluetun builds its DNS malware/ad block lists in memory at
              # startup and every UPDATER_PERIOD (24h). That transient spike
              # blew past 128Mi and OOMKilled the sidecar in a crashloop,
              # taking the whole pod's VPN egress (and thus qBittorrent) down.
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: qbittorrent
        # ClusterIP: WebUI is served via the ingress below, and incoming peer
        # connections now arrive through the VPN tunnel — not a LAN LoadBalancer
        # port — so the direct bittorrent port and static LB IP are dropped.
        type: ClusterIP
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: qBittorrent
          gethomepage.dev/icon: qbittorrent.png
          gethomepage.dev/description: Torrent Client
          gethomepage.dev/widget.type: qbittorrent
          gethomepage.dev/widget.url: http://qbittorrent.media
          gethomepage.dev/widget.username: "{{ `{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}` }}"
          gethomepage.dev/widget.password: "{{ `{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}` }}"
        hostnames:
          - torrents.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
            timeouts:
              request: 0s
    serviceMonitor:
      app:
        serviceName: qbittorrent
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
    persistence:
      config:
        existingClaim: *app
      tmp:
        type: emptyDir
      # Provide the kernel TUN device to gluetun. Mounting the node's
      # /dev/net/tun avoids the in-container mknod (blocked by the device cgroup
      # without privileged), which is why gluetun hit "operation not permitted".
      dev-net-tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /dev/net/tun
      scripts:
        type: configMap
        name: qbittorrent-scripts
        defaultMode: 0775
        globalMounts:
          - readOnly: true
      media:
        type: nfs
        server: ${NAS_IP}
        path: /mnt/main/media
        globalMounts:
          - path: /Downloads
            subPath: Downloads
      # In-progress downloads (qBittorrent temp path). A separate ZFS dataset,
      # main/downloads-incomplete: 64K records (main/media uses 1M, so random
      # piece writes forced read-modify-write of whole records on RAIDZ2),
      # sync off, no snapshots, 2T quota. Completed files move to /Downloads.
      incomplete:
        type: nfs
        server: ${NAS_IP}
        path: /mnt/main/downloads-incomplete
        advancedMounts:
          qbittorrent:
            app:
              - path: /incomplete
  driftDetection:
    mode: enabled
