apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: qbittorrent-secret
  data:
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: QBITTORRENT_USERNAME
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: QBITTORRENT_PASSWORD
---
# Gluetun VPN credentials — templated separately so only the OPENVPN_* fields
# land in the envFrom secret, not the qbittorrent UI credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: qbittorrent-vpn-secret
    template:
      engineVersion: v2
      data:
        OPENVPN_USER: "{{ .PIA_USERNAME }}"
        OPENVPN_PASSWORD: "{{ .PIA_PASSWORD }}"
  data:
    - secretKey: PIA_USERNAME
      remoteRef:
        key: PIA_USERNAME
    - secretKey: PIA_PASSWORD
      remoteRef:
        key: PIA_PASSWORD
---
# Plex token for the upload-throttle sidecar (reuses the existing PLEX_TOKEN key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-throttle
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: qbittorrent-throttle-secret
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: PLEX_TOKEN
---
# OPNsense API key for the upload-throttle sidecar's gaming detection. The
# router user qbt-gaming-detector holds only read-only privileges (Diagnostics:
# Firewall sessions, ARP Table, NDP Table). Separate from the Plex token so a
# missing key only disables gaming detection (the envFrom is optional).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-opnsense
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: qbittorrent-opnsense-secret
  data:
    - secretKey: OPNSENSE_API_KEY
      remoteRef:
        key: QBITTORRENT_OPNSENSE_API_KEY
    - secretKey: OPNSENSE_API_SECRET
      remoteRef:
        key: QBITTORRENT_OPNSENSE_API_SECRET
