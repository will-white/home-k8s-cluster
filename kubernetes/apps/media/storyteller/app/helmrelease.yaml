---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app storyteller
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: storyteller
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      storyteller:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.gitlab.com/storyteller-platform/storyteller
              tag: web-v2.14.23@sha256:1ae16005572519f56abac2d65ab879d20115cd257fde7e89cf739ea82aed4de3
            env:
              TZ: ${TIMEZONE}
              STORYTELLER_DATA_DIR: /data
              PUID: "1000"
              PGID: "1000"
            envFrom:
              - secretRef:
                  name: storyteller-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8001
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8001
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
            # Forced alignment (Whisper transcription) is CPU- and memory-hungry:
            # upstream asks for 8 GB RAM and up to 4 cores. Idle cost is small.
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 8Gi
    defaultPodOptions:
      # Entrypoint refuses a pre-set user and wants PUID/PGID: start as root,
      # it drops privileges itself.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: storyteller
        ports:
          http:
            port: 8001
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Storyteller
          gethomepage.dev/icon: mdi-book-open-page-variant
          gethomepage.dev/description: Readaloud Ebooks (audio/ebook sync)
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
            timeouts:
              request: 0s
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      media:
        type: nfs
        server: ${NAS_IP}
        path: /mnt/main/media
        globalMounts:
          # Auto-import root (Settings -> import path = /library). Storyteller
          # writes metadata into these files and the readaloud EPUB next to the
          # source EPUB; Audiobookshelf and Calibre-Web Automated own the same
          # folders, so keep an eye on the first imports.
          - path: /library/audiobooks
            subPath: audiobooks
          - path: /library/ebooks
            subPath: books/calibre-library
  driftDetection:
    mode: enabled
