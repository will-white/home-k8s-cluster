---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app suwayomi
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: suwayomi
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      suwayomi:
        containers:
          app:
            image:
              repository: ghcr.io/suwayomi/suwayomi-server
              tag: stable@sha256:e59f212ccf91b26de8676a063a2db90256c148c6261535c7c477d47a43d9751b
            env:
              TZ: ${TIMEZONE}
              AUTH_MODE: none
              DOWNLOAD_AS_CBZ: "true"
              # Auto-download new chapters as soon as the global update finds them
              AUTO_DOWNLOAD_CHAPTERS: "true"
              # Default true skips auto-download for entries that still have unread
              # chapters -> the reason new chapters were not being grabbed
              AUTO_DOWNLOAD_EXCLUDE_UNREAD: "false"
              # No cap on how many unread downloaded chapters may pile up
              AUTO_DOWNLOAD_NEW_CHAPTERS_LIMIT: "0"
              # Check sources every 6h (minimum allowed) instead of 12h
              UPDATE_INTERVAL: "6"
              # Do not exclude manga from the global update based on read state;
              # otherwise unread/unstarted/completed series are never checked, so
              # their new chapters are never found and thus never auto-downloaded
              UPDATE_EXCLUDE_UNREAD: "false"
              UPDATE_EXCLUDE_STARTED: "false"
              UPDATE_EXCLUDE_COMPLETED: "false"
              # Refresh each entry's own metadata (status/cover/description)
              # during the global update, not just its chapter list
              UPDATE_MANGA_INFO: "true"
              # NOTE: there is deliberately no DOWNLOADS_PATH here. The image's
              # startup_script.sh only sed's a fixed allow-list of env vars into
              # server.conf, and downloadsPath is not on it -- so setting it is a
              # silent no-op and downloads land on the config PVC. The downloads
              # directory is bind-mounted from the NAS instead (see persistence).
              # Route Cloudflare-challenged sources through the in-cluster
              # FlareSolverr (byparr) instance; only invoked when a source
              # actually returns a challenge, so otherwise a no-op
              FLARESOLVERR_ENABLED: "true"
              FLARESOLVERR_URL: http://flaresolverr.media.svc.cluster.local:8191
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: suwayomi
        ports:
          http:
            port: 4567
    ingress:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Suwayomi
          gethomepage.dev/icon: suwayomi.png
          gethomepage.dev/description: Manga Downloads
        className: internal
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /home/suwayomi/.local/share/Tachidesk
      media:
        type: nfs
        server: ${NAS_IP}
        path: /mnt/main/media
        globalMounts:
          - path: /media
          # Keep the ~9G of downloaded chapters off the 10Gi config PVC: the
          # data dir's default downloads/ location is served straight from the
          # NAS, so files land in /mnt/main/media/manga/mangas/<source>/<title>/
          - path: /home/suwayomi/.local/share/Tachidesk/downloads
            subPath: manga
  driftDetection:
    mode: enabled
