---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: cleanuparr-secret
    template:
      engineVersion: v2
      data:
        DATABASE_PROVIDER: postgres
        POSTGRES_HOST: &dbHost postgres16-rw.database.svc.cluster.local
        POSTGRES_PORT: "5432"
        POSTGRES_USER: &dbUser "{{ .CLEANUPARR_POSTGRES_USER }}"
        POSTGRES_PASS: &dbPass "{{ .CLEANUPARR_POSTGRES_PASSWORD }}"
        POSTGRES_DB: &dbName cleanuparr
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPERUSER_PASSWORD }}"
  data:
    - secretKey: CLEANUPARR_POSTGRES_USER
      remoteRef:
        key: CLEANUPARR_POSTGRES_USER
    - secretKey: CLEANUPARR_POSTGRES_PASSWORD
      remoteRef:
        key: CLEANUPARR_POSTGRES_PASSWORD
    - secretKey: POSTGRES_SUPERUSER_PASSWORD
      remoteRef:
        key: POSTGRES_SUPERUSER_PASSWORD
