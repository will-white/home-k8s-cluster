---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: tdarr-secret
    template:
      engineVersion: v2
      data:
        # Server session-signing key (tsec_...). Replaces the auto-generated
        # one in /app/configs, which was exposed in a terminal on 2026-10-27.
        authSecretKey: "{{ .TDARR_AUTH_SECRET_KEY }}"
        # API key (tapi_...) seeded into ApiKeysJSONDB at startup; the
        # plex.internal node sends it as `apiKey`, the exporter as TDARR_API_KEY.
        seededApiKey: "{{ .TDARR_API_KEY }}"
        TDARR_API_KEY: "{{ .TDARR_API_KEY }}"
  data:
    - secretKey: TDARR_AUTH_SECRET_KEY
      remoteRef:
        key: TDARR_AUTH_SECRET_KEY
    - secretKey: TDARR_API_KEY
      remoteRef:
        key: TDARR_API_KEY
