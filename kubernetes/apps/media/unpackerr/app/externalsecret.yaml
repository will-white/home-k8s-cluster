apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: unpackerr-secret
    template:
      engineVersion: v2
      data:
        UN_RADARR_0_API_KEY: "{{ .RADARR_API_KEY }}"
        UN_SONARR_0_API_KEY: "{{ .SONARR_API_KEY }}"
        UN_LIDARR_0_API_KEY: "{{ .LIDARR_API_KEY }}"
        # 60-150 ASCII chars; also read by the ServiceMonitor (Bearer)
        UN_WEBSERVER_API_KEYS_0_KEY: "{{ .UNPACKERR_API_KEY }}"
        UN_WEBSERVER_UI_PASSWORD: "admin:{{ .UNPACKERR_UI_PASSWORD }}"
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: SONARR_API_KEY
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: LIDARR_API_KEY
    - secretKey: UNPACKERR_API_KEY
      remoteRef:
        key: UNPACKERR_API_KEY
    - secretKey: UNPACKERR_UI_PASSWORD
      remoteRef:
        key: UNPACKERR_UI_PASSWORD
