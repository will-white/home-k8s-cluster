---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: unpackerr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v1.0.1@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
            env:
              TZ: ${TIMEZONE}
              UN_WEBSERVER_METRICS: true
              # v1: /metrics requires an API key with system:metrics:read.
              # The key (UN_WEBSERVER_API_KEYS_0_KEY) and the UI login
              # (UN_WEBSERVER_UI_PASSWORD) come from unpackerr-secret; without
              # a password v1 starts the UI with a temporary one in the log.
              UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: system:metrics:read
              UN_WEBSERVER_API_KEYS_0_NAME: prometheus
              UN_WEBSERVER_API_KEYS_0_ROLES_0: metrics
              UN_WEBSERVER_LOG_FILE: /logs/webserver.log
              UN_ACTIVITY: true
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local
              UN_SONARR_0_PATHS_0: /Downloads/sonarr
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local
              UN_RADARR_0_PATHS_0: /Downloads/radarr
              UN_LIDARR_0_URL: http://lidarr.media.svc.cluster.local
              UN_LIDARR_0_PATHS_0: /Downloads/lidarr
            envFrom:
              - secretRef:
                  name: unpackerr-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: unpackerr
        ports:
          http:
            port: 5656
    serviceMonitor:
      app:
        serviceName: unpackerr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            authorization:
              type: Bearer
              credentials:
                name: unpackerr-secret
                key: UN_WEBSERVER_API_KEYS_0_KEY
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      logs:
        type: emptyDir
      media:
        type: nfs
        server: ${NAS_IP}
        path: /mnt/main/media
        globalMounts:
          - path: /Downloads
            subPath: Downloads
  driftDetection:
    mode: enabled
