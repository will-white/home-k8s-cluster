---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kometa
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: kometa
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      kometa:
        annotations:
          reloader.stakater.com/auto: "true"
        type: cronjob
        cronjob:
          # Weekly is plenty: the only playlist (One Piece Canon) changes when
          # the list in Git changes or new episodes land, and a run takes ~40 min.
          # After editing a list, run once by hand:
          #   kubectl -n media create job kometa-manual --from=cronjob/kometa
          schedule: "0 3 * * 0"
          timeZone: ${TIMEZONE}
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              # renovate: datasource=docker
              repository: docker.io/kometateam/kometa
              tag: v2.5.4@sha256:e3f509c3044ac011e1938dae2f7e80ea3cfe9663720a9f98683d1ea28c127e64
            args: ["--run", "--read-only-config"]
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: kometa-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                # 10m starved the run on busy nodes: the One Piece canon playlist
                # resolves ~1,000 episodes, each parsing the show's full episode
                # list, and crawled at ~2 lookups/min. No CPU limit, as usual.
                cpu: 500m
                memory: 256Mi
              limits:
                memory: 512Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    persistence:
      config:
        existingClaim: *app
      config-file:
        type: configMap
        name: kometa-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      lists:
        type: configMap
        name: kometa-lists
        globalMounts:
          - path: /config/lists
            readOnly: true
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
  driftDetection:
    mode: enabled
