apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: kometa-secret
    template:
      engineVersion: v2
      data:
        KOMETA_PLEX_TOKEN: "{{ .PLEX_TOKEN }}"
        KOMETA_TMDB_API_KEY: "{{ .TMDB_API_KEY }}"
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: PLEX_TOKEN
    - secretKey: TMDB_API_KEY
      remoteRef:
        key: TMDB_API_KEY
