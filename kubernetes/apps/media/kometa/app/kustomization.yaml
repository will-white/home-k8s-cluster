apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: kometa-configmap
    files:
      - config.yml=./resources/config.yml
  - name: kometa-lists
    files:
      - ./resources/lists/one-piece-canon.txt
      - ./resources/lists/playlists.yml
      - ./resources/lists/fate-stay-night.txt
      - ./resources/lists/monogatari.txt
generatorOptions:
  disableNameSuffixHash: true
