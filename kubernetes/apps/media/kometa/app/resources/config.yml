## Kometa Configuration
## https://kometa.wiki/en/latest/config/configuration/

plex:
  # Plex listens on 32400 (nothing answers on :80; Gatus checks plex.internal:32400 too)
  url: http://plex.internal:32400
  token: <<env.KOMETA_PLEX_TOKEN>>
  timeout: 60
  db_cache: 40

tmdb:
  # Kometa secret syntax: env KOMETA_<NAME> is substituted where the config says <<NAME>>
  # (any other <<...>> placeholder is replaced with nothing).
  apikey: <<TMDB_API_KEY>>
  language: en

settings:
  cache: true
  cache_expiration: 60
  asset_directory:
    - config/assets
  create_asset_folders: false
  sync_mode: sync
  minimum_items: 1
  playlist_sync_to_users: all
  playlist_report: false
  verify_ssl: true

libraries:
  # Required section - leave empty if only using playlists
  # Add library names matching your Plex libraries to manage collections

playlists:
  # "Recently Added Movies" - movies added in the last 30 days, newest first
  Recently Added Movies:
    sync_to_users: all
    plex_search:
      all:
        added: 30d
      sort_by: added.desc
      limit: 50

  # "Recently Added Shows" - TV episodes added in the last 30 days
  Recently Added Shows:
    sync_to_users: all
    plex_search:
      all:
        added: 30d
        type: show
      sort_by: added.desc
      limit: 50

  # Add additional playlists below following the same pattern

  # "One Piece Canon" - every non-filler episode, in order. Trakt support was
  # removed in Kometa 2.5.0, so the list now lives in Git: lists/one-piece-canon.txt
  # (generated by lists/generate-one-piece-canon.py from animefillerlist.com and
  # mounted at /config/lists). Numbering follows the Plex TV agent (TMDb seasons).
  One Piece Canon:
    sync_to_users: all
    libraries: TV Shows
    sync_mode: sync
    text_file: /config/lists/one-piece-canon.txt
