## Kometa Configuration
## https://kometa.wiki/en/latest/config/configuration/

plex:
  # Plex listens on 32400 (nothing answers on :80; Gatus checks plex.internal:32400 too)
  url: http://plex.internal:32400
  # "env" = read KOMETA_PLEX_TOKEN. Kometa reserves that variable, so a <<...>>
  # placeholder is blanked; only the literal value env picks it up.
  token: env
  timeout: 60
  db_cache: 40

tmdb:
  # Kometa secret syntax: env KOMETA_<NAME> is substituted where the config says <<NAME>>
  # (any other <<...>> placeholder is replaced with nothing).
  apikey: <<TMDB_API_KEY>>
  language: en

settings:
  cache: true
  cache_expiration: 60
  asset_directory:
    - config/assets
  create_asset_folders: false
  sync_mode: sync
  minimum_items: 1
  playlist_sync_to_users: all
  playlist_report: false
  verify_ssl: true

libraries:
  # Kometa requires at least one library, and each mapping must be a non-empty
  # map (a null value crashes the Plex setup). No collection/overlay files:
  # these mappings only exist so the playlists can search them.
  Movies:
    library_name: Movies
  TV Shows:
    library_name: TV Shows

# Playlists live in their own file (Kometa ignores a top-level `playlists:` key
# in config.yml). Mounted from the kometa-lists ConfigMap.
playlist_files:
  - file: /config/lists/playlists.yml
