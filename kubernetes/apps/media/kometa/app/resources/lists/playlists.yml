---
# Kometa playlist file (config.yml -> playlist_files). Every playlist is built
# by the nightly run and copied into each user's account (sync_to_users: all).
# Kometa docs: https://kometa.wiki/en/latest/files/playlists/
playlists:
  # Every non-filler One Piece episode, in order. Trakt support was removed in
  # Kometa 2.5.0, so the list lives in Git: one-piece-canon.txt (generated by
  # generate-one-piece-canon.py from animefillerlist.com). Numbering follows the
  # Plex TV agent (TMDb arc seasons); the TVDb ID only identifies the show.
  One Piece Canon:
    libraries: TV Shows
    sync_to_users: all
    sync_mode: sync
    text_file: /config/lists/one-piece-canon.txt
