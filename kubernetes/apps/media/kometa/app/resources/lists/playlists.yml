---
# Kometa playlist file (config.yml -> playlist_files). Every playlist is built
# by the nightly run and copied into each user's account (sync_to_users: all).
# Kometa docs: https://kometa.wiki/en/latest/files/playlists/
playlists:
  # Every non-filler One Piece episode, in order. Trakt support was removed in
  # Kometa 2.5.0, so the list lives in Git: one-piece-canon.txt (generated by
  # generate-one-piece-canon.py from animefillerlist.com). Season/episode numbers
  # follow the file names (TheTVDB seasons, as Sonarr names them).
  One Piece Canon:
    libraries: TV Shows
    sync_to_users: all
    sync_mode: sync
    text_file: /config/lists/one-piece-canon.txt

  # Fate/stay night route order (Fate -> UBW -> Heaven's Feel films -> Fate/Zero).
  # Mixes TV episodes and films, so it searches both libraries.
  Fate/stay night Watch Order:
    libraries: Movies, TV Shows
    sync_to_users: all
    sync_mode: sync
    text_file: /config/lists/fate-stay-night.txt
    test: true  # lets `--tests --playlists-only` run just this quickly; no effect on normal runs

  # Monogatari in release order, including the Kizumonogatari films.
  Monogatari Watch Order:
    libraries: Movies, TV Shows
    sync_to_users: all
    sync_mode: sync
    text_file: /config/lists/monogatari.txt
    test: true  # lets `--tests --playlists-only` run just this quickly; no effect on normal runs
