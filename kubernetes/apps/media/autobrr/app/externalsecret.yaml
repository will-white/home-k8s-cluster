apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: autobrr-secret
    template:
      engineVersion: v2
      data:
        AUTOBRR__DATABASE_TYPE: postgres
        AUTOBRR__POSTGRES_DATABASE: &dbName autobrr
        AUTOBRR__POSTGRES_HOST: &dbHost postgres16-rw.database.svc.cluster.local
        AUTOBRR__POSTGRES_USER: &dbUser "{{ .AUTOBRR_POSTGRES_USER }}"
        AUTOBRR__POSTGRES_PASS: &dbPass "{{ .AUTOBRR_POSTGRES_PASSWORD }}"
        AUTOBRR__POSTGRES_PORT: "5432"
        AUTOBRR__SESSION_SECRET: "{{ .AUTOBRR_SESSION_SECRET }}"
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPERUSER_PASSWORD }}"
  data:
    - secretKey: AUTOBRR_POSTGRES_USER
      remoteRef:
        key: AUTOBRR_POSTGRES_USER
    - secretKey: AUTOBRR_POSTGRES_PASSWORD
      remoteRef:
        key: AUTOBRR_POSTGRES_PASSWORD
    - secretKey: AUTOBRR_SESSION_SECRET
      remoteRef:
        key: AUTOBRR_SESSION_SECRET
    - secretKey: POSTGRES_SUPERUSER_PASSWORD
      remoteRef:
        key: POSTGRES_SUPERUSER_PASSWORD
