---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app readmeabook
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: readmeabook
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      readmeabook:
        # Switched off 2026-10-30 (Hardcover via Shelfmark is the requester). Data
        # and backups are kept; set replicas back to 1 to re-enable.
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom: &envFrom
              - secretRef:
                  name: readmeabook-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/kikootwo/readmeabook
              tag: 1.2.12@sha256:8e8eb2212f445ad2c720de7c7806dbf9ec6b2946d377aefba4326b0dd6bd2e2a
            env:
              TZ: ${TIMEZONE}
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3030
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3030
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # s6/supervisord image: starts as root, then drops to PUID/PGID (needs the
      # default CHOWN/SETUID/SETGID caps, which Pod Security baseline allows).
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: readmeabook
        ports:
          http:
            port: 3030
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/config
            subPath: config
          - path: /app/cache
            subPath: cache
          - path: /var/lib/redis
            subPath: redis
      media:
        type: nfs
        server: ${NAS_IP}
        path: /mnt/main/media
        globalMounts:
          # Audiobookshelf library (Settings -> audiobook path: /media/audiobooks)
          - path: /media
            subPath: audiobooks
          # Same path qBittorrent reports for completed downloads.
          - path: /Downloads
            subPath: Downloads
  driftDetection:
    mode: enabled
