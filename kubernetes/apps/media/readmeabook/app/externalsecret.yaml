---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readmeabook
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: readmeabook-secret
    template:
      engineVersion: v2
      data:
        # External Postgres: the image then skips its bundled one. Redis stays
        # bundled: BullMQ's Lua scripts fail on Dragonfly (emulated cluster mode:
        # "script tried accessing undeclared key").
        DATABASE_URL: "postgresql://{{ .READMEABOOK_POSTGRES_USER }}:{{ .READMEABOOK_POSTGRES_PASSWORD }}@postgres16-rw.database.svc.cluster.local:5432/readmeabook"
        INIT_POSTGRES_DBNAME: &dbName readmeabook
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .READMEABOOK_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .READMEABOOK_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPERUSER_PASSWORD }}"
  data:
    - secretKey: READMEABOOK_POSTGRES_USER
      remoteRef:
        key: READMEABOOK_POSTGRES_USER
    - secretKey: READMEABOOK_POSTGRES_PASSWORD
      remoteRef:
        key: READMEABOOK_POSTGRES_PASSWORD
    - secretKey: POSTGRES_SUPERUSER_PASSWORD
      remoteRef:
        key: POSTGRES_SUPERUSER_PASSWORD
