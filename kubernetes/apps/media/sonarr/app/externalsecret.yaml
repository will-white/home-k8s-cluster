apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: sonarr-secret
    template:
      engineVersion: v2
      data:
        SONARR__AUTH__APIKEY: "{{ .SONARR_API_KEY }}"
        SONARR__POSTGRES__HOST: &dbHost postgres16-rw.database.svc.cluster.local
        SONARR__POSTGRES__PORT: "5432"
        SONARR__POSTGRES__USER: &dbUser "{{ .SONARR_POSTGRES_USER }}"
        SONARR__POSTGRES__PASSWORD: &dbPass "{{ .SONARR_POSTGRES_PASSWORD }}"
        SONARR__POSTGRES__MAINDB: &dbName sonarr_main
        # Pushover tokens were lost when the old `pushover` BWS secret was deleted; re-add per docs/secrets.md "Known gaps" once recreated.
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPERUSER_PASSWORD }}"
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: SONARR_API_KEY
    - secretKey: SONARR_POSTGRES_USER
      remoteRef:
        key: SONARR_POSTGRES_USER
    - secretKey: SONARR_POSTGRES_PASSWORD
      remoteRef:
        key: SONARR_POSTGRES_PASSWORD
    - secretKey: POSTGRES_SUPERUSER_PASSWORD
      remoteRef:
        key: POSTGRES_SUPERUSER_PASSWORD
