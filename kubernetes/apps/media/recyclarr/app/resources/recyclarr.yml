###
# Recyclarr guide: https://recyclarr.dev/wiki/guide-configs/
###
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
#
# Profile naming convention (must match the profile names in Sonarr/Radarr UI):
#   HD             - Default. WEB 720p floor, Remux-1080p cutoff. End-user friendly.
#   4K             - Opt-in. WEB 1080p floor, Bluray-2160p cutoff. For 4K TVs.
#   Anime          - Auto-applied via Seerr rule. WEB 720p floor, Remux-1080p cutoff.
#                    Audio-language preference: Dual Audio > Japanese > Dub only.
#                    See the "Anime" custom_formats section below for the scoring.
#   Best Available - Escape hatch for obscure films. SDTV floor, Remux-2160p cutoff.
#
# Recyclarr only manages custom format definitions and per-profile CF scores.
# Profile structure (qualities allowed, cutoff, upgrade settings) is managed in the UI.
# The TRaSH `quality-profile` templates are intentionally NOT included here so Recyclarr
# will not recreate the old-named profiles ("WEB-1080p", "UHD Bluray + WEB", etc.).

sonarr:
  sonarr_main:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env_var SONARR_API_KEY

    delete_old_custom_formats: true

    include:
      - template: sonarr-quality-definition-series
      - template: sonarr-v4-custom-formats-web-1080p
      - template: sonarr-v4-custom-formats-web-2160p
      - template: sonarr-quality-definition-anime
      - template: sonarr-v4-custom-formats-anime

    custom_formats:
##################  HD / 4K / Best Available — shared  ##################
      # Junk blockers (TRaSH-default negative scores; reject bad releases but DO NOT
      # prevent legitimate lower-quality fallback grabs).
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
          - 1b3994c551cbb92a2c781af061f4ab44 # Scene
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ (low-quality release groups)
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK (raw Blu-ray disc dumps)
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available

      # Prefer season packs over single-episode grabs (TRaSH default +10).
      - trash_ids:
          - 3bc5f395426614e155e585a2f056cdf1 # Season Pack
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available

##################  4K / Best Available — only  ##################
      - trash_ids:
          # Comment out the next line if you and all of your users' setups are fully DV compatible
          - 9b27ab6498ec0f31a3353992e19434ca # DV (WEBDL)

          # HDR10+ Boost (purely additive; boosts HDR10+ releases, no impact on non-HDR clients).
          # Upstream consolidated DV HDR10+ Boost into this single CF (regex now matches both HDR10+ and DV HDR10+).
          - 0c4b99df9206d2cfac3c05ab897dd62a # HDR10+ Boost
        assign_scores_to:
          - name: 4K
          - name: Best Available

      # SDR (no WEBDL): keeps SDR WEB available as fallback for non-HDR clients,
      # while blocking bloated SDR Remux/Bluray files.
      - trash_ids:
          - 83304f261cf516bb208c18c54c0adf97 # SDR (no WEBDL)
        assign_scores_to:
          - name: 4K
          - name: Best Available

##################  Anime  ##################
      - trash_ids:
          - 026d5aadd1a6b4e550b134cb6c72b3ca # Uncensored
        assign_scores_to:
          - name: Anime
            score: 0 # Adjust scoring as desired
      - trash_ids:
          - b2550eb333d27b75833e25b8c2557b38 # 10bit
        assign_scores_to:
          - name: Anime
            score: 0 # Adjust scoring as desired
      # Audio-language preference ladder. Ordering we want:
      #   1. Dual Audio (English + Japanese)  - best, gets both tracks
      #   2. Japanese audio (English subs)    - the standard anime release
      #   3. Dub only (English audio, no JP)  - acceptable last resort
      #
      # All three scores are POSITIVE on purpose. TRaSH ships these CFs with a
      # default score of -10000 (they are blockers in the stock guide), and the
      # Anime profile's "Minimum Custom Format Score" is set in the Sonarr UI —
      # not here. Keeping every tier above zero means all three stay grabbable
      # regardless of what that minimum is, and only the relative ordering
      # decides which release wins. Do not "restore" these to TRaSH defaults.
      #
      # The ladder is spaced 3000 apart — wider than the largest additive bonus any
      # single release can carry on the Anime profile: the group-tier CFs added in
      # the "TRaSH parity" section below top out at Anime BD Tier 01 (+1400), plus
      # Uncensored (+500) and 10bit (+500) in Radarr = +2400 max. Spacing > that
      # guarantees the language choice ALWAYS wins outright and the group tiers only
      # break ties WITHIN a language band. "Language: Not English" only fires when
      # English is absent from the parsed languages, so dub-only never triggers it;
      # a dual-audio release mis-parsed as Japanese-only can also match it
      # (7000+4000), but Dual Audio still wins biggest. Keep the spacing in sync in
      # both apps.
      - trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
        assign_scores_to:
          - name: Anime
            score: 7000
      - trash_ids:
          - 69aa1e159f97d860440b04cd6d590c4f # Language: Not English (i.e. Japanese audio)
        assign_scores_to:
          - name: Anime
            score: 4000
      - trash_ids:
          - 9c14d194486c4014d422adc64092d794 # Dubs Only
        assign_scores_to:
          - name: Anime
            score: 1000

      # Raws are Japanese audio with NO subtitles. Without this they would pick
      # up the +4000 "Language: Not English" score above and outrank a dub, which
      # is not what "we'll take Japanese" means. Blocked outright.
      - trash_ids:
          - b4a1b3d705159cdca36d71e57ca86871 # Anime Raws
        assign_scores_to:
          - name: Anime
            score: -10000

      # Junk blockers for Anime profile.
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
          - 1b3994c551cbb92a2c781af061f4ab44 # Scene
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
        assign_scores_to:
          - name: Anime

##################  TRaSH parity — release-group tiers, junk & tiebreakers  ##################
      # Recyclarr's `include:` templates DEFINE these CFs but assign their scores to TRaSH's
      # default profile names (WEB-1080p / WEB-2160p / UHD Bluray + WEB / Remux-1080p - Anime),
      # which we renamed to HD / 4K / Anime / Best Available — so Recyclarr dropped every one of
      # those scores (the "profile names ... do not exist" [WRN] lines in the sync log). The
      # blocks below re-address them to OUR profiles at the TRaSH default score (no explicit
      # `score:`), restoring full-guide behaviour: release-group tier ranking, junk penalties
      # (x265-HD, upscaled, 3D, LQ-title, WEB-Scene), repack/proper, and streaming tiebreakers.
      # "Best Available" gets the UNION of the 1080p + 2160p positive tiers so it ranks the best
      # release at ANY resolution — its whole purpose as the resolution-agnostic escape hatch.
      # Generated from recyclarr/config-templates@master; re-sync when the includes are bumped.
      # Remux release-group tiers (TRaSH default scores)
      - trash_ids:
          - 9965a052eb87b0d10313b1cea89eb451 # Remux Tier 01
          - 8a1d0c3d7497e741736761a1da866a2e # Remux Tier 02
        assign_scores_to:
          - name: HD
          - name: Best Available
      # WEB release-group tiers (TRaSH default scores)
      - trash_ids:
          - e6258996055b9fbab7e9cb2f75819294 # WEB Tier 01
          - 58790d4e2fdcd9733aa7ae68ba2bb503 # WEB Tier 02
          - d84935abd3f8556dcd51d4f27e22d0a6 # WEB Tier 03
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available
      # HDR (generic boost) (TRaSH default scores)
      - trash_ids:
          - 505d871304820ba7106b693be6fe4a9e # HDR
        assign_scores_to:
          - name: 4K
          - name: Best Available
      # Streaming resolution boost (TRaSH default scores)
      - trash_ids:
          - 218e93e5702f44a68ad9e3c6ba87d2f0 # HD Streaming Boost
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available
      # Streaming resolution boost (TRaSH default scores)
      - trash_ids:
          - 43b3cf48cb385cd3eac608ee6bca7f09 # UHD Streaming Boost
        assign_scores_to:
          - name: 4K
          - name: Best Available
      # Streaming service tags (tiebreakers) (TRaSH default scores)
      - trash_ids:
          - d660701077794679fd59e8bdf4ce3a29 # AMZN
          - f67c9ca88f463a48346062e8ad07713f # ATVP
          - 77a7b25585c18af08f60b1547bb9b4fb # CC
          - 36b72f59f4ea20aad9316f475f2d9fbb # DCU
          - dc5f2bb0e0262155b5fedd0f6c5d2b55 # DSCP
          - 89358767a60cc28783cdc3d0be9388a4 # DSNP
          - 7a235133c87f7da4c8cccceca7e3c7a6 # HBO
          - a880d6abc21e7c16884f3ae393f84179 # HMAX
          - f6cce30f1733d5c8194222a7507909bb # Hulu
          - 0ac24a2a68a9700bcb7eeca8e5cd644c # iT
          - 81d1fbf600e2540cee87f3a23f9d3c1c # MAX
          - d34870697c9db575f17700212167be23 # NF
          - 1656adc6d7bb2c8cca6acfb6592db421 # PCOK
          - c67a75ae4a1715f2bb4d492755ba4195 # PMTP
          - ae58039e1319178e6be73caab5c42166 # SHO
          - 1efe8da11bfd74fbbcd4d8117ddb9213 # STAN
          - 9623c5c9cac8e939c1b9aedd32f640bf # SYFY
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available
      # Repack/Proper (TRaSH default scores)
      - trash_ids:
          - eb3d5cc0a2be0db205fb823640db6a3c # Repack v2
          - 44e7c4de10ae50265753082e5dc76047 # Repack v3
          - ec8fa7296b64e8cd390a1600981f3923 # Repack/Proper
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available
      # Unwanted (negative TRaSH defaults) (TRaSH default scores)
      - trash_ids:
          - fbcb31d8dabd2a319072b84fc0b7249c # Extras
          - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
          - d0c516558625b04b363fa6c5c2c7cfd4 # WEB Scene
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available
      # Unwanted (negative TRaSH defaults) (TRaSH default scores)
      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available
          - name: Anime
      # Anime release-group tiers (TRaSH default scores)
      - trash_ids:
          - 949c16fe0a8147f50ba82cc2df9411c9 # Anime BD Tier 01 (Top SeaDex Muxers)
          - ed7f1e315e000aef424a58517fa48727 # Anime BD Tier 02 (SeaDex Muxers)
          - 096e406c92baa713da4a72d88030b815 # Anime BD Tier 03 (SeaDex Muxers)
          - 30feba9da3030c5ed1e0f7d610bcadc4 # Anime BD Tier 04 (SeaDex Muxers)
          - 545a76b14ddc349b8b185a6344e28b04 # Anime BD Tier 05 (Remuxes)
          - 25d2afecab632b1582eaf03b63055f72 # Anime BD Tier 06 (FanSubs)
          - 0329044e3d9137b08502a9f84a7e58db # Anime BD Tier 07 (P2P/Scene)
          - c81bbfb47fed3d5a3ad027d077f889de # Anime BD Tier 08 (Mini Encodes)
          - e0014372773c8f0e1bef8824f00c7dc4 # Anime Web Tier 01 (Muxers)
          - 19180499de5ef2b84b6ec59aae444696 # Anime Web Tier 02 (Top FanSubs)
          - c27f2ae6a4e82373b0f1da094e2489ad # Anime Web Tier 03 (Official Subs)
          - 4fd5528a3a8024e6b49f9c67053ea5f3 # Anime Web Tier 04 (Official Subs)
          - 29c2a13d091144f63307e4a8ce963a39 # Anime Web Tier 05 (FanSubs)
          - dc262f88d74c651b12e9d90b39f6c753 # Anime Web Tier 06 (FanSubs)
        assign_scores_to:
          - name: Anime
      # Anime streaming services (TRaSH default scores)
      - trash_ids:
          - a370d974bc7b80374de1d9ba7519760b # ABEMA
          - d54cd2bf1326287275b56bccedb72ee2 # ADN
          - 7dd31f3dee6d2ef8eeaa156e23c3857e # B-Global
          - 4c67ff059210182b59cdd41697b8cb08 # Bilibili
          - 3e0b26604165f463f3e8e192261e7284 # CR
          - 1284d18e693de8efe0fe7d6b3e0b9170 # FUNi
          - 570b03b3145a25011bf073274a407259 # HIDIVE
          - 44a8ee6403071dd7b8a3a8dd3fe8cb20 # VRV
        assign_scores_to:
          - name: Anime
      # Release version (v0..v4) (TRaSH default scores)
      - trash_ids:
          - d2d7b8a9d39413da5f44054080e028a3 # v0
          - 273bd326df95955e1b6c26527d1df89b # v1
          - 228b8ee9aa0a609463efca874524a6b8 # v2
          - 0e5833d3af2cc5fa96a0c29cd4477feb # v3
          - 4fc15eeb8f2f9a749f918217d4234ad8 # v4
        assign_scores_to:
          - name: Anime
      # Anime unwanted (TRaSH default scores)
      - trash_ids:
          - e3515e519f3b1360cbfc17651944354c # Anime LQ Groups
          - 07a32f77690263bb9fda1842db7e273f # VOSTFR
        assign_scores_to:
          - name: Anime

radarr:
  radarr_main:
    base_url: http://radarr.media.svc.cluster.local
    api_key: !env_var RADARR_API_KEY

    delete_old_custom_formats: true

    include:
      - template: radarr-quality-definition-movie
      # UHD CF set is the most comprehensive 4K-tier definition pack.
      - template: radarr-custom-formats-uhd-bluray-web
      # 1080p CF set covers HD-tier formats.
      - template: radarr-custom-formats-remux-web-1080p
      - template: radarr-custom-formats-anime

    custom_formats:
##################  HD / 4K / Best Available — shared  ##################
      # Audio (TRaSH default scores; positive/additive — boost preferred audio formats
      # without blocking releases that only have basic audio. Lossy formats keep low
      # positive scores so they remain valid fallback grabs.)
      - trash_ids:
          - 496f355514737f7d83bf7aa4d24f8169 # TrueHD Atmos
          - 2f22d89048b01681dde8afe203bf2e95 # DTS X
          - 417804f7f2c4308c1f4c5d380d4c4475 # ATMOS (undefined)
          - 1af239278386be2919e1bcee0bde047e # DD+ ATMOS
          - 3cafb66171b47f226146a0770576870f # TrueHD
          - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
          - a570d4a0e56a2874b64e5bfa55202a1b # FLAC
          - e7c2fcae07cbada050a0af3357491d7b # PCM
          - 8e109e50e0a0b83a5098b056e13bf6db # DTS-HD HRA
          - 185f1dd7264c4562b9022d963ac37424 # DD+
          - f9f847ac70a0af62ea4a08280b859636 # DTS-ES
          - 1c1a4c5e823891c75bc50380a6866f73 # DTS
          - 240770601cc226190c367ef59aba7463 # AAC
          - c2998bd0d90ed5621d8df281e839436e # DD
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available

      # Movie versions — Remaster boost (additive).
      - trash_ids:
          - 570bc9ebecd92723d2d21500f4be314c # Remaster
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available

      # Junk blockers (TRaSH-default negative scores).
      - trash_ids:
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          # - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          # EVO (no WEBDL) removed upstream from TRaSH-Guides; LQ CF now covers EVO releases.
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
          - 90a6f9a284dff5103f6346090e6280c8 # LQ
          - ed38b889b31be83fda192888e2286d83 # BR-DISK
        assign_scores_to:
          - name: HD
          - name: 4K
          - name: Best Available

##################  4K / Best Available — only  ##################
      # 4K-specific movie versions.
      - trash_ids:
          - eca37840c13c6ef2dd0262b141a5482f # 4K Remaster
          - 957d0f44b592285f26449575e8b1167e # Special Edition
        assign_scores_to:
          - name: 4K
          - name: Best Available

      - trash_ids:
          # Comment out the next line if you and all of your users' setups are fully DV compatible
          - 923b6abef9b17f937fab56cfcf89e1f1 # DV (WEBDL)

          # HDR10+ Boost (purely additive; boosts HDR10+ releases, no impact on non-HDR clients).
          # Upstream consolidated DV HDR10+ Boost into this single CF (regex now matches both HDR10+ and DV HDR10+).
          - caa37d0df9c348912df1fb1d88f9273a # HDR10+ Boost
        assign_scores_to:
          - name: 4K
          - name: Best Available

      # SDR (no WEBDL): keeps SDR WEB available as fallback for non-HDR clients,
      # while blocking bloated SDR Remux/Bluray files.
      - trash_ids:
          - 25c12f78430a3a23413652cbd1d48d77 # SDR (no WEBDL)
        assign_scores_to:
          - name: 4K
          - name: Best Available

##################  Anime  ##################
      - trash_ids:
          - 064af5f084a0a24458cc8ecd3220f93f # Uncensored
        assign_scores_to:
          - name: Anime
            score: 500 # Adjust scoring as desired

      - trash_ids:
          - a5d148168c4506b55cf53984107c396e # 10bit
        assign_scores_to:
          - name: Anime
            score: 500 # Adjust scoring as desired

      # Audio-language preference ladder — mirrors the Sonarr Anime profile:
      #   1. Dual Audio (English + Japanese)  - best, gets both tracks
      #   2. Japanese audio (English subs)    - the standard anime release
      #   3. Dub only (English audio, no JP)  - acceptable last resort
      #
      # All three scores are POSITIVE on purpose. TRaSH ships these CFs with a
      # default score of -10000 (they are blockers in the stock guide), and the
      # Anime profile's "Minimum Custom Format Score" is set in the Radarr UI —
      # not here. Keeping every tier above zero means all three stay grabbable
      # regardless of what that minimum is, and only the relative ordering
      # decides which release wins. Do not "restore" these to TRaSH defaults.
      #
      # The ladder is spaced 3000 apart — wider than the largest additive bonus any
      # single release can carry here: Anime BD Tier 01 (+1400) from the "TRaSH
      # parity" section below, plus Uncensored (+500) and 10bit (+500) = +2400 max.
      # Spacing > that keeps the language choice ALWAYS on top, with the group tiers
      # only breaking ties within a language band. Keep the spacing in sync with the
      # Sonarr Anime profile.
      - trash_ids:
          - 4a3b087eea2ce012fcc1ce319259a3be # Anime Dual Audio
        assign_scores_to:
          - name: Anime
            score: 7000
      - trash_ids:
          - 0dc8aec3bd1c47cd6c40c46ecd27e846 # Language: Not English (i.e. Japanese audio)
        assign_scores_to:
          - name: Anime
            score: 4000
      - trash_ids:
          - b23eae459cc960816f2d6ba84af45055 # Dubs Only
        assign_scores_to:
          - name: Anime
            score: 1000

      # Raws are Japanese audio with NO subtitles. Without this they would pick
      # up the +4000 "Language: Not English" score above and outrank a dub, which
      # is not what "we'll take Japanese" means. Blocked outright.
      - trash_ids:
          - 06b6542a47037d1e33b15aa3677c2365 # Anime Raws
        assign_scores_to:
          - name: Anime
            score: -10000

      # Junk blockers for Anime profile.
      - trash_ids:
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          # EVO (no WEBDL) removed upstream from TRaSH-Guides; LQ CF now covers EVO releases.
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
