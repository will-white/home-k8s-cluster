---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app recyclarr
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: recyclarr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      recyclarr:
        # Reloader starts a sync Job from this CronJob as soon as a mounted
        # ConfigMap changes. Content-only edits are safe. A PR that ALSO adds
        # mounts here races: Flux applies the ConfigMaps first, so the Job
        # runs from the old spec without the new files ("Invalid trash_id",
        # seen with #1560). After such a PR, run one Job by hand once the
        # HelmRelease is Ready, or let the 00:00 run fix it.
        annotations:
          reloader.stakater.com/auto: "true"
        type: cronjob
        cronjob:
          schedule: 0 0 * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: recyclarr-secret
            args: ["sync"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
      # Weekly back-catalogue upgrade search (see resources/upgrade-search.sh).
      # Sonarr/Radarr only upgrade from RSS; this re-searches a random sample
      # of cutoff-unmet / missing items so old files reach the profile cutoff.
      upgrade-search:
        type: cronjob
        cronjob:
          schedule: 0 3 * * 0
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            # alpine/k8s bundles bash + curl + jq + shuf.
            image:
              repository: docker.io/alpine/k8s
              tag: 1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
            command: ["/bin/bash", "/scripts/upgrade-search.sh"]
            env:
              SONARR_MAX_SEASONS: "20"
              RADARR_MAX_MOVIES: "25"
            envFrom:
              - secretRef:
                  name: recyclarr-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          recyclarr:
            app:
              - path: /config
      config-file:
        type: configMap
        name: recyclarr-configmap
        advancedMounts:
          recyclarr:
            app:
              - path: /config/recyclarr.yml
                subPath: recyclarr.yml
                readOnly: true
              - path: /config/settings.yml
                subPath: settings.yml
                readOnly: true
      custom-formats-sonarr:
        type: configMap
        name: recyclarr-custom-formats-sonarr
        advancedMounts:
          recyclarr:
            app:
              - path: /config/custom-formats/sonarr
                readOnly: true
      custom-formats-radarr:
        type: configMap
        name: recyclarr-custom-formats-radarr
        advancedMounts:
          recyclarr:
            app:
              - path: /config/custom-formats/radarr
                readOnly: true
      config-logs:
        type: emptyDir
        advancedMounts:
          recyclarr:
            app:
              - path: /config/logs
      upgrade-search-script:
        type: configMap
        name: recyclarr-upgrade-search
        defaultMode: 0555
        advancedMounts:
          upgrade-search:
            app:
              - path: /scripts/upgrade-search.sh
                subPath: upgrade-search.sh
                readOnly: true
  driftDetection:
    mode: enabled
