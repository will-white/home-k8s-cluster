apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: recyclarr-configmap
    files:
      - recyclarr.yml=./resources/recyclarr.yml
      - settings.yml=./resources/settings.yml
  - name: recyclarr-upgrade-search
    files:
      - upgrade-search.sh=./resources/upgrade-search.sh
    options:
      # bash ${VAR:-default} syntax; keep Flux postBuild envsubst off it.
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
