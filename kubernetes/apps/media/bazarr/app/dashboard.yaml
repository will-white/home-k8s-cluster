---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bazarr-dashboard
  namespace: media
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana_folder: "Media"
data:
  # Hand-built from exportarr's bazarr collector metric names
  # (internal/arr/collector/bazarr.go). No community grafana.com dashboard
  # exists for Bazarr.
  bazarr.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "schemaVersion": 39,
      "title": "Bazarr",
      "uid": "bazarr-exportarr",
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "index": 0
                    },
                    "1": {
                      "text": "OK",
                      "index": 1
                    }
                  }
                }
              ]
            }
          },
          "title": "System status",
          "type": "stat",
          "targets": [
            {
              "expr": "max(bazarr_system_status)",
              "legendFormat": "status"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "title": "Subtitles downloaded",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(bazarr_subtitles_downloaded_total)",
              "legendFormat": "downloaded"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              }
            }
          },
          "title": "Missing subtitles",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(bazarr_subtitles_missing_total)",
              "legendFormat": "missing"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "title": "Wanted subtitles",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(bazarr_subtitles_wanted_total)",
              "legendFormat": "wanted"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "pieType": "donut",
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "value",
                "percent"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "title": "Downloads by language",
          "type": "piechart",
          "targets": [
            {
              "expr": "bazarr_subtitles_language_total",
              "legendFormat": "{{language}}",
              "instant": true
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "showPoints": "never"
              }
            }
          },
          "title": "Missing subtitles (total vs movies)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(bazarr_movie_subtitles_missing_total)",
              "legendFormat": "movies"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "options": {
            "showHeader": true
          },
          "title": "System health issues",
          "type": "table",
          "targets": [
            {
              "expr": "bazarr_system_health_issues",
              "legendFormat": "",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "url": true,
                  "Value": false
                }
              }
            }
          ]
        }
      ]
    }
