---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bazarr-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: bazarr
        group: guarded
        # /health is a cheap 200; / renders the SPA and can blip the 5s
        # response-time threshold while bazarr is busy indexing subtitles.
        url: http://bazarr.media.svc.cluster.local:6767/health
        interval: 1m
        ui:
          hide-hostname: true
          hide-url: true
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: pushover
