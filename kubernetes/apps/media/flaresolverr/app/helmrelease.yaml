---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flaresolverr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      flaresolverr:
        containers:
          app:
            image:
              repository: ghcr.io/thephaseless/byparr
              tag: latest@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: info
              # Byparr launches a full browser per in-flight request, so memory
              # scales with concurrency. Dropping images/media/fonts cuts the
              # per-session footprint; challenge pages don't need them.
              BLOCK_MEDIA: "true"
              # Pinned so the browser skips the egress-IP geo lookup, which
              # can't reach the internet from this pod and fails on every request.
              BROWSER_LOCALE: en-US
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8191
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # 2Gi OOM-killed whenever two challenge solves overlapped
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: flaresolverr
        ports:
          http:
            port: *port
  driftDetection:
    mode: enabled
