apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kavita
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
    - name: external-secrets-stores
    - name: volsync
  path: ./kubernetes/apps/media/kavita/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: media
      GATUS_PORT: "5000"
      GATUS_PATH: /api/Health
      # source-only volsync backup of the existing PVC (SQLite user state)
      VOLSYNC_STORAGECLASS: ceph-filesystem
      VOLSYNC_SNAPSHOTCLASS: csi-ceph-filesystem
      VOLSYNC_SNAP_ACCESSMODES: ReadWriteMany
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_BOOTSTRAP_SOURCE_NAMESPACE: media
      VOLSYNC_ACCESSMODES: ReadWriteMany
      PVC_VOLSYNC_STORAGECLASS: ceph-filesystem
      VOLSYNC_BOOTSTRAP_TRIGGER: restore-2026-08-09
