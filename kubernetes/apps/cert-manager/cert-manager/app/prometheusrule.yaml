---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-rules
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerAbsent
          expr: |
            absent(up{job="cert-manager"})
          for: 5m
          annotations:
            summary: >-
              Cert Manager has dissapeared from Prometheus service discovery
          labels:
            severity: critical

    - name: certificates
      rules:
        # Keyed on each Certificate's own renewal time rather than a fixed
        # days-left threshold: renewBefore varies (Let's Encrypt 30d, the
        # barman-cloud plugin's 15d), so the old "< 21d" rule paged critical
        # on healthy barman-cloud certs for 5 days before every renewal.
        # 1h of grace covers cert-manager's retry backoff.
        - alert: CertManagerCertRenewalOverdue
          expr: |
            avg by (exported_namespace, namespace, name) (time() - certmanager_certificate_renewal_timestamp_seconds) > 3600
          for: 5m
          annotations:
            summary: >-
              The cert {{ $labels.exported_namespace }}/{{ $labels.name }} is {{ $value | humanizeDuration }} past its renewal time and has not renewed
          labels:
            severity: warning

        - alert: CertManagerCertExpirySoon
          expr: |
            avg by (exported_namespace, namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < (7 * 24 * 3600)
          for: 5m
          annotations:
            summary: >-
              The cert {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }} and renewal is overdue
          labels:
            severity: critical

        - alert: CertManagerCertNotReady
          expr: |
            max by (name, exported_namespace, namespace, condition) (certmanager_certificate_ready_status{condition!="True"} == 1)
          for: 5m
          annotations:
            summary: >-
              The cert {{ $labels.name }} is not ready to serve traffic
          labels:
            severity: critical

        - alert: CertManagerHittingRateLimits
          expr: |
            sum by (host) (rate(certmanager_http_acme_client_request_count{status="429"}[5m])) > 0
          for: 5m
          annotations:
            summary: >-
              Cert manager hitting LetsEncrypt rate limits
          labels:
            severity: critical
