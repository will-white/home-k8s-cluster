---
groups:
  - name: loki-recording-rules
    interval: 1m
    rules:
      - record: loki:app_log_errors:1m
        expr: |
          sum by (namespace, app) (count_over_time({app=~".+"} |~ "(?i)(error|err|fatal|panic|exception)" [1m]))
      - record: loki:app_log_lines:1m
        expr: |
          sum by (namespace, app) (count_over_time({app=~".+"} [1m]))
      - record: loki:namespace_log_bytes:5m
        expr: |
          sum by (namespace) (bytes_over_time({namespace=~".+"} [5m]))
      # Cilium Gateway access logs (network/cilium-gateway/app/gatewayclass.yaml)
      # are written by the cilium-envoy pods; `gateway` is "namespace/name".
      - record: loki:ingress_5xx:5m
        expr: |
          sum by (gateway) (count_over_time({namespace="kube-system", app="cilium-envoy"} | json | __error__="" | response_code >= 500 [5m]))
      - record: loki:ingress_requests:5m
        expr: |
          sum by (gateway) (count_over_time({namespace="kube-system", app="cilium-envoy"} | json | __error__="" | response_code > 0 [5m]))
