---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opnsense-rules
spec:
  groups:
    - name: opnsense.rules
      rules:
        # Services whose loss takes something down for the whole house: FRR
        # (BGP routes to the cluster's LB IPs), dnsmasq (DHCP and .internal
        # names), Caddy (LAN HTTPS for router-served names), pf (the firewall).
        - alert: OPNsenseCriticalServiceDown
          annotations:
            summary: OPNsense service {{ $labels.name }} is not running
            description: >-
              {{ $labels.description }} is stopped on the router. Start it under
              System → Diagnostics → Services, and check the system log for why it
              exited.
          expr: opnsense_services_status{name=~"frr|dnsmasq|caddy|pf"} == 0
          for: 2m
          labels:
            severity: critical
        - alert: OPNsenseServiceDown
          annotations:
            summary: OPNsense service {{ $labels.name }} is not running
            description: >-
              {{ $labels.description }} is stopped on the router.
          expr: opnsense_services_status{name=~"ntpd|dhcpd6|radvd|syslog-ng|configd|nut_upsmon|acme"} == 0
          for: 10m
          labels:
            severity: warning
        # /var/log is a RAM disk on this box. When it filled on 2026-09-16,
        # logging stopped silently for weeks (docs/opnsense.md in home-lab,
        # "IPv6 outage + full /var/log").
        - alert: OPNsenseLogDiskFilling
          annotations:
            summary: OPNsense /var/log is {{ $value | humanizePercentage }} full
            description: >-
              The /var/log tmpfs stops accepting writes when full and every log goes
              quiet. Lower log retention, or clear old logs under /var/log.
          expr: >-
            1 - node_filesystem_avail_bytes{instance="opnsense",mountpoint="/var/log"}
            / node_filesystem_size_bytes{instance="opnsense",mountpoint="/var/log"} > 0.8
          for: 15m
          labels:
            severity: warning
        - alert: OPNsenseRootDiskFilling
          annotations:
            summary: OPNsense root filesystem is {{ $value | humanizePercentage }} full
          expr: >-
            1 - node_filesystem_avail_bytes{instance="opnsense",mountpoint="/"}
            / node_filesystem_size_bytes{instance="opnsense",mountpoint="/"} > 0.85
          for: 30m
          labels:
            severity: warning
        # 2026-11-17: a LAN link flap made the kernel drop the BGP routes while FRR
        # still reported them installed and every session stayed up, so all Gateway
        # VIPs (192.168.110.x) were unreachable for ~5 h with nothing firing. The
        # router runs /usr/local/sbin/bgp-route-watchdog (home-lab repo,
        # opnsense/sbin) which writes these metrics and restarts FRR itself.
        - alert: OPNsenseBGPRoutesMissingFromKernel
          annotations:
            summary: OPNsense kernel has {{ $value }} fewer BGP routes than FRR
            description: >-
              FRR holds more 192.168.110.x prefixes than the kernel routing table.
              Traffic to those Gateway/LB VIPs leaves via the WAN default route and
              is lost. The watchdog should have restarted FRR after about 45 s; if
              this is still firing, run `sudo configctl service restart frr` on the
              router (ssh opnsense) and check `netstat -rn -f inet | grep -c
              ^192.168.110` (expect 6 VIPs x 8 nodes = 48). Threshold: any
              difference for 2 minutes, longer than the watchdog's 45 s plus
              restart time.
          expr: >-
            router_bgp_routes_bgp_table{instance="opnsense"}
            - router_bgp_routes_kernel{instance="opnsense"} > 0
          for: 2m
          labels:
            severity: critical
        - alert: OPNsenseBGPRouteWatchdogHealed
          annotations:
            summary: The router watchdog restarted FRR to restore BGP routes
            description: >-
              Kernel routes to the cluster VIPs vanished and the watchdog fixed it by
              restarting FRR. Find the trigger: `grep 'link state' /var/log/system/*`
              on the router for an igb2 flap, and the UniFi switch event log.
          expr: increase(router_bgp_route_heals_total{instance="opnsense"}[30m]) > 0
          labels:
            severity: warning
        - alert: OPNsenseBGPRouteWatchdogStale
          annotations:
            summary: The router BGP route watchdog has stopped reporting
            description: >-
              No fresh router_bgp_* metrics: the watchdog is not running (or the
              textfile collector is not reading /var/tmp/node_exporter). Restart it
              with /usr/local/etc/rc.syshook.d/start/85-bgp-route-watchdog on the router.
          expr: >-
            time() - router_bgp_watchdog_last_run_timestamp_seconds{instance="opnsense"} > 300
            or absent(router_bgp_watchdog_last_run_timestamp_seconds{instance="opnsense"})
          for: 10m
          labels:
            severity: warning
        - alert: OPNsenseMetricsMissing
          annotations:
            summary: No metrics from OPNsense ({{ $labels.job }})
            description: >-
              The rules above can't fire without these. Check the opnsense-exporter
              pod (API key) or node_exporter on the router (:9100).
          expr: up{job=~"opnsense-exporter|lab-node-opnsense"} == 0
          for: 15m
          labels:
            severity: warning
