---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opnsense-exporter
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: opnsense-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      opnsense-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker
              repository: ghcr.io/athennamind/opnsense-exporter
              tag: 0.0.19@sha256:e1f79c770dba7d3165e12836e4b6f849be93a8b2a25116b7ea11c5da8c3ad2db
            env:
              OPNSENSE_EXPORTER_OPS_PROTOCOL: "https"
              OPNSENSE_EXPORTER_OPS_API: "192.168.5.1:8443"
              OPNSENSE_EXPORTER_OPS_INSECURE: "true"
              OPNSENSE_EXPORTER_INSTANCE_LABEL: "opnsense"
              # Unbound and Kea are not used on this router. Unbound's
              # stats call returns {"status":"failed"} and the exporter logs an
              # error each scrape; the Kea lease calls only queue behind the rest.
              OPNSENSE_EXPORTER_DISABLE_UNBOUND: "true"
              OPNSENSE_EXPORTER_DISABLE_KEADHCPV4: "true"
              OPNSENSE_EXPORTER_DISABLE_KEADHCPV6: "true"
              OPNSENSE_EXPORTER_OPS_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: opnsense-exporter-secret
                    key: OPNSENSE_API_KEY
              OPNSENSE_EXPORTER_OPS_API_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: opnsense-exporter-secret
                    key: OPNSENSE_API_SECRET
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: opnsense-exporter
        ports:
          http:
            port: 8080
    serviceMonitor:
      app:
        serviceName: opnsense-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            # OPNsense's API serialises requests: ~1s alone, 5-10s for the
            # exporter's parallel burst. 10s timed out ~60% of scrapes.
            interval: 2m
            scrapeTimeout: 45s
  driftDetection:
    mode: enabled
