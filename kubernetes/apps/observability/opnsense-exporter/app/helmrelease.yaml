---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opnsense-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: opnsense-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      opnsense-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker
              repository: ghcr.io/athennamind/opnsense-exporter
              tag: 0.0.17@sha256:04a28ad984a091ea1e8371cf515da8b38b1d00416f53e6b5c9d68fec39d92ce0
            env:
              OPNSENSE_EXPORTER_OPS_PROTOCOL: "https"
              OPNSENSE_EXPORTER_OPS_API: "192.168.5.1:8443"
              OPNSENSE_EXPORTER_OPS_INSECURE: "true"
              OPNSENSE_EXPORTER_INSTANCE_LABEL: "opnsense"
              OPNSENSE_EXPORTER_OPS_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: opnsense-exporter-secret
                    key: OPNSENSE_API_KEY
              OPNSENSE_EXPORTER_OPS_API_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: opnsense-exporter-secret
                    key: OPNSENSE_API_SECRET
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: opnsense-exporter
        ports:
          http:
            port: 8080
    serviceMonitor:
      app:
        serviceName: opnsense-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
  driftDetection:
    mode: enabled
