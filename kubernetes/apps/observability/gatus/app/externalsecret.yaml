apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: gatus-secret
    template:
      engineVersion: v2
      data:
        SECRET_DOMAIN: ${SECRET_DOMAIN}
        # Shared homelab Pushover app token (see docs/secrets.md) — the original
        # per-app gatus token was lost when the `pushover` BWS blob was deleted.
        PUSHOVER_TOKEN: "{{ .PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        INIT_POSTGRES_DBNAME: gatus
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .GATUS_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .GATUS_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPERUSER_PASSWORD }}"
  data:
    - secretKey: GATUS_POSTGRES_USER
      remoteRef:
        key: GATUS_POSTGRES_USER
    - secretKey: GATUS_POSTGRES_PASSWORD
      remoteRef:
        key: GATUS_POSTGRES_PASSWORD
    - secretKey: POSTGRES_SUPERUSER_PASSWORD
      remoteRef:
        key: POSTGRES_SUPERUSER_PASSWORD
    - secretKey: PUSHOVER_TOKEN
      remoteRef:
        key: PUSHOVER_TOKEN
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: PUSHOVER_USER_KEY
