apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: alertmanager-secret
    template:
      engineVersion: v2
      data:
        ALERTMANAGER_HEARTBEAT_URL: "{{ .ALERTMANAGER_HEARTBEAT_URL }}"
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        ALERTMANAGER_PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
  data:
    - secretKey: ALERTMANAGER_HEARTBEAT_URL
      remoteRef:
        key: ALERTMANAGER_HEARTBEAT_URL
    # Shared homelab Pushover app token — one BWS entry serves alertmanager and
    # gatus (see docs/secrets.md); the local secretKey keeps the name the
    # alertmanager config already consumes.
    - secretKey: ALERTMANAGER_PUSHOVER_TOKEN
      remoteRef:
        key: PUSHOVER_TOKEN
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: PUSHOVER_USER_KEY
