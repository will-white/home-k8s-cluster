# Scrape node_exporter (and smartctl_exporter on plex) on non-K8s lab hosts.
# Agents are managed in the home-lab repo (ansible/playbooks/monitoring.yml);
# canonical host/target list: home-lab/docs/monitoring.md
---
apiVersion: v1
kind: Service
metadata:
  name: lab-node-plex
  namespace: observability
  labels:
    app.kubernetes.io/name: lab-node-plex
    app.kubernetes.io/instance: plex
spec:
  clusterIP: None
  ports:
    - name: node
      port: 9100
      protocol: TCP
      targetPort: 9100
    - name: smartctl
      port: 9633
      protocol: TCP
      targetPort: 9633
---
apiVersion: v1
kind: Endpoints
metadata:
  name: lab-node-plex
  namespace: observability
subsets:
  - addresses:
      - ip: ${PLEX_IP}
    ports:
      - name: node
        port: 9100
        protocol: TCP
      - name: smartctl
        port: 9633
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-node-plex
  namespace: observability
  labels:
    app.kubernetes.io/name: lab-node-plex
    app.kubernetes.io/instance: plex
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-node-plex
  endpoints:
    - port: node
      scheme: http
      interval: 30s
      relabelings:
        - targetLabel: instance
          replacement: plex
    - port: smartctl
      scheme: http
      interval: 60s
      relabelings:
        - targetLabel: instance
          replacement: plex
