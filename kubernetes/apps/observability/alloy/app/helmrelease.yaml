---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: alloy
      version: 1.14.3
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: alloy
    controller:
      type: daemonset
      volumes:
        extra:
          # Tail positions. Promtail kept them on a hostPath too; without one
          # every restart re-reads /var/log/pods from the start.
          - name: alloy-data
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
    alloy:
      storagePath: /var/lib/alloy
      mounts:
        varlog: true
        extra:
          - name: alloy-data
            mountPath: /var/lib/alloy
      securityContext:
        # /var/log/pods is root-only on Talos; promtail ran as root as well.
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 40m
          memory: 256Mi
        limits:
          memory: 1Gi
      configMap:
        content: |
          // Logs only. Metrics stay with kube-prometheus-stack.
          //
          // Label set mirrors what the promtail chart produced (namespace, pod,
          // container, app, instance, component, node_name, job, filename,
          // stream) so existing Loki rules and dashboards keep working.

          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
              regex         = ";*([^;]+)(;.*)?"
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
              regex         = ";*([^;]+)(;.*)?"
              target_label  = "instance"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
              regex         = ";*([^;]+)(;.*)?"
              target_label  = "component"
            }
            rule {
              source_labels = ["namespace", "app"]
              separator     = "/"
              target_label  = "job"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
            // Static pods (kube-apiserver etc.) log under their config hash.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_container_name",
              ]
              separator     = "/"
              regex         = "true/(.*)"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          loki.process "pods" {
            forward_to = [loki.write.loki.receiver]

            stage.cri {}

            // Cilium Gateway access logs (CiliumGatewayClassConfig in
            // network/cilium-gateway). Same labels the nginx access logs had.
            stage.match {
              selector = "{namespace=\"kube-system\", app=\"cilium-envoy\"}"
              stage.json {
                expressions = {
                  response_code = "response_code",
                  method        = "method",
                }
              }
              stage.labels {
                values = {
                  status = "response_code",
                  method = "",
                }
              }
            }

            stage.match {
              selector = "{namespace=\"flux-system\"}"
              stage.json {
                expressions = { level = "level" }
              }
              stage.labels {
                values = { level = "" }
              }
            }

            stage.match {
              selector = "{namespace=\"rook-ceph\", container=\"rook-ceph-operator\"}"
              stage.json {
                expressions = { level = "level" }
              }
              stage.labels {
                values = { level = "" }
              }
            }

            stage.match {
              selector = "{app=\"homebox\"}"
              stage.json {
                expressions = { level = "level" }
              }
              stage.labels {
                values = { level = "" }
              }
            }
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki-headless.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
    serviceMonitor:
      enabled: true
  driftDetection:
    mode: enabled
