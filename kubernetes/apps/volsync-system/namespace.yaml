apiVersion: v1
kind: Namespace
metadata:
  name: volsync-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Mover pods run in the namespace of the PVC they back up, not here; this
    # namespace only holds the volsync operator, snapshot-controller and the
    # kopia UI, none of which need host access.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
