---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-rgw-backup
spec:
  # Run daily at 3 AM
  schedule: "0 3 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rclone
              image: rclone/rclone:1.75@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              # Each Ceph RGW bucket is owned by its own OBC user; the shared
              # backup-user cannot read them (403). Sync each bucket with its own
              # credentials (supplied via RCLONE_CONFIG_* env from the OBC secrets)
              # to the matching Garage bucket. [garage] comes from /config/rclone.conf.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  RCLONE_OPTS="--config=/config/rclone.conf --verbose --transfers=4 --checkers=8 --fast-list"
                  # rclone sync is a DESTRUCTIVE mirror: on a freshly rebuilt
                  # cluster with an empty RGW it would delete every backup in
                  # Garage (the DR runbook's golden rule). Two guards:
                  #  1. refuse to run when the source looks wiped
                  #  2. --max-delete caps deletions even when the source is
                  #     merely diminished (kopia maintenance legitimately
                  #     deletes packs, so the cap is generous)
                  check_min() { # check_min <remote:bucket> <min-objects>
                    N=$(rclone $RCLONE_OPTS size --json "$1" | sed 's/.*"count":\([0-9]*\).*/\1/')
                    if [ "$N" -lt "$2" ]; then
                      echo "ABORT: $1 has only $N objects (< $2) - source looks empty/wiped, refusing to mirror" >&2
                      exit 1
                    fi
                    echo "$1: $N objects (>= $2, ok)"
                  }
                  check_min cnpg:cloudnative-pg 50
                  check_min volsync:volsync-backups 200
                  echo "Syncing cloudnative-pg -> garage"
                  rclone $RCLONE_OPTS --max-delete=5000 sync cnpg:cloudnative-pg garage:cloudnative-pg
                  echo "Syncing volsync-backups -> garage"
                  # NOTE: never mirror-delete the etcd-snapshots/ prefix — it is
                  # written to Garage directly by talos-backup, not via RGW.
                  rclone $RCLONE_OPTS --max-delete=5000 --exclude "etcd-snapshots/**" sync volsync:volsync-backups garage:volsync-backups
              env:
                # Source remote: cloudnative-pg bucket (OBC secret in this namespace)
                - name: RCLONE_CONFIG_CNPG_TYPE
                  value: s3
                - name: RCLONE_CONFIG_CNPG_PROVIDER
                  value: Ceph
                - name: RCLONE_CONFIG_CNPG_ENDPOINT
                  value: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
                - name: RCLONE_CONFIG_CNPG_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_CNPG_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg
                      key: AWS_SECRET_ACCESS_KEY
                # Source remote: volsync-backups bucket (OBC creds mirrored from volsync-system)
                - name: RCLONE_CONFIG_VOLSYNC_TYPE
                  value: s3
                - name: RCLONE_CONFIG_VOLSYNC_PROVIDER
                  value: Ceph
                - name: RCLONE_CONFIG_VOLSYNC_ENDPOINT
                  value: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
                - name: RCLONE_CONFIG_VOLSYNC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: volsync-obc-creds
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_VOLSYNC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: volsync-obc-creds
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: rclone-config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: rclone-config
              secret:
                secretName: rclone-rgw-backup
