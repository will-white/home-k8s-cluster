---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-rgw-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: rclone-rgw-backup
    template:
      engineVersion: v2
      data:
        # Only the Garage (destination) remote lives in the config file. The Ceph
        # source remotes are defined per-bucket in the CronJob via RCLONE_CONFIG_*
        # env vars, using each bucket's own OBC credentials (least privilege). The
        # shared backup-user cannot read the OBC-owned buckets (403), so it is not used.
        rclone.conf: |
          [garage]
          type = s3
          provider = Other
          endpoint = {{ .GARAGE_ENDPOINT }}
          access_key_id = {{ .GARAGE_ACCESS_KEY }}
          secret_access_key = {{ .GARAGE_SECRET_KEY }}
          # Garage validates the SigV4 signing scope against its configured s3_region.
          # rclone defaults to us-east-1, which Garage rejects with AuthorizationHeaderMalformed.
          region = garage
          acl = private
          force_path_style = true
  data:
    - secretKey: GARAGE_ENDPOINT
      remoteRef:
        key: GARAGE_ENDPOINT
    - secretKey: GARAGE_ACCESS_KEY
      remoteRef:
        key: GARAGE_ACCESS_KEY
    - secretKey: GARAGE_SECRET_KEY
      remoteRef:
        key: GARAGE_SECRET_KEY
