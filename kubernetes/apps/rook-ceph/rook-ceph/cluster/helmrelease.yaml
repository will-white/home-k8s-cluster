---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chart:
    spec:
      chart: rook-ceph-cluster
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
      version: v1.20.6
      interval: 1h
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: volsync-system
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          allowVolumeExpansion: true
          enabled: true
          isDefault: true
          mountOptions: ["discard"]
          name: ceph-block
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            imageFormat: "2"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      deletionPolicy: Delete
      enabled: true
      isDefault: false
      name: csi-ceph-blockpool
    cephClusterSpec:
      # The rook orchestrator module logs every Kubernetes API response body at
      # DEBUG. A full PodList is ~1.5MiB and it polls every 15s (~6MiB/min,
      # ~8.6GiB/day). Loki rejected each one against its 256KiB max entry size
      # ("max entry size '262144' bytes exceeded ... entry with length
      # '1574250' bytes"), so ceph-mgr logs were dropped outright rather than
      # truncated — the active mgr was effectively unlogged.
      #
      # The option only takes effect when the module reloads, which the
      # 8-hourly `ceph mgr fail` in mgr-maintenance/ already does.
      cephConfig:
        mgr:
          mgr/rook/log_level: info
        osd:
          # BLUESTORE_SLOW_OP_ALERT ships hair-trigger defaults: a SINGLE op
          # over bluestore_log_op_age (5s) latches HEALTH_WARN for a full 24h
          # (threshold 1, lifetime 86400). One transient stall during a node
          # reboot or an OSD restart therefore parks the cluster in HEALTH_WARN
          # all day — which matters here because tuppr's TalosUpgrade gates on
          # `status.ceph.health in ['HEALTH_OK']`, so a stale blip silently
          # blocks node upgrades.
          #
          # Widen "slow" to 10s, require a handful of occurrences rather than
          # one, and let a one-off age out in an hour. A genuinely degraded
          # device produces slow ops continuously and still trips the alert;
          # only the single-sample latch is suppressed.
          bluestore_log_op_age: "10"
          bluestore_slow_ops_warn_threshold: "5"
          bluestore_slow_ops_warn_lifetime: "3600"
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
        ssl: false
        urlPrefix: /
      # Prevent node drains from causing data unavailability
      disruptionManagement:
        managePodBudgets: true
        osdMaintenanceTimeout: 30
        pgHealthCheckTimeout: 0
        manageMachineDisruptionBudgets: false
      mgr:
        modules:
          - enabled: true
            name: pg_autoscaler
          - enabled: true
            name: rook
          # Trim optional mgr modules to reduce active-mgr memory pressure after
          # the Ceph tentacle 20.2.2 upgrade started OOMKilling the active mgr
          # (grows to the 4Gi limit in ~14h). The prometheus module (usual leak
          # culprit) is already patched in 20.2.2 and tuned (exclude_perf_counters
          # true, rbd_stats_pools empty), so trim the other enabled-but-unused
          # modules: insights (chatty health_history writer), nfs (no exports /
          # CephNFS CRs), restful (legacy REST API, has its own historical leak).
          # See rook/rook#17786 (matching mgr OOM on rook 1.20 + ceph 20.2.2).
          - enabled: false
            name: insights
          - enabled: false
            name: nfs
          - enabled: false
            name: restful
      network:
        connections:
          requireMsgr2: true
        provider: host
      placement:
        all:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
      storage:
        config:
          osdsPerDevice: "1"
        deviceFilter: nvme0n1
        useAllDevices: true
        useAllNodes: true
      resources:
        osd:
          limits:
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 2Gi
        # mgr memory keeps outgrowing its limit (1Gi -> 2Gi -> now 4Gi). The
        # insights / prometheus / dashboard modules warm up, and post-Ceph-
        # tentacle (v20) the cephfs volumes/nfs connection pool grows under
        # CSI/volsync subvolume clone load, spiking mgr-a to ~2Gi -> OOMKill.
        # Bump headroom; mgr is a singleton (mgr-b standby). If it still OOMs
        # at 4Gi, investigate the cephfs connection-pool leak / disable unused
        # modules (e.g. nfs) rather than raising further.
        mgr:
          limits:
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
    cephFileSystemVolumeSnapshotClass:
      deletionPolicy: Delete
      enabled: true
      isDefault: false
      name: csi-ceph-filesystem
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          dataPools:
            - failureDomain: host
              name: data0
              replicated:
                size: 3
          metadataPool:
            replicated:
              size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            placement:
              topologySpreadConstraints:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: ceph-filesystem
                  maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 1Gi
        storageClass:
          allowVolumeExpansion: true
          enabled: true
          isDefault: false
          name: ceph-filesystem
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          pool: data0
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephObjectStores:
      - ingress:
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
          enabled: true
          host:
            name: rgw.${SECRET_DOMAIN}
            path: /
          ingressClassName: internal
        name: ceph-objectstore
        spec:
          dataPool:
            erasureCoded:
              codingChunks: 1
              dataChunks: 2
            failureDomain: host
          gateway:
            hostNetwork: false
            instances: 2
            port: 80
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 1Gi
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          preservePoolsOnDelete: true
        storageClass:
          enabled: true
          name: ceph-bucket
          parameters:
            region: us-west-1
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    configOverride: |
      [global]
      bdev_enable_discard = true
      bdev_async_discard = true
      osd_class_update_on_start = false
    ingress:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Manage Rook-Ceph
          gethomepage.dev/group: Storage & Infrastructure
          gethomepage.dev/icon: rook.png
          gethomepage.dev/name: Rook/Ceph
          gethomepage.dev/pod-selector: mgr=a
        host:
          name: rook.${SECRET_DOMAIN}
          path: /
        ingressClassName: internal
    monitoring:
      createPrometheusRules: true
      enabled: true
      prometheusRuleOverrides:
        CephPGImbalance:
          disabled: true
    toolbox:
      enabled: true
  driftDetection:
    mode: enabled
