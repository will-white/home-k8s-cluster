---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chart:
    spec:
      chart: rook-ceph-cluster
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
      version: v1.20.3
      interval: 1h
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: volsync-system
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            # size 4, not 3, so the cluster survives losing TWO of the eight
            # hosts. There is one OSD per host and the failure domain is host,
            # so at size 3 a PG lands on 3 of 8 hosts and ~10.7% of PGs (6 of
            # the 56 host-triples) contain any given pair -- lose both and the
            # PG drops below min_size and BLOCKS client I/O. Measured on
            # 2026-08-22: 19 PGs inactive, 23% objects degraded, and a cascade
            # of read-only RBD remounts that outlived the outage.
            #
            # At size 4 a PG spans 4 hosts, loses at most 2, and the 2 that
            # remain still satisfy min_size. min_size stays 2 on its own:
            # osd_pool_default_min_size is 0 (auto = size - size/2, so 4 -> 2)
            # and the existing pools already store min_size 2, which raising
            # size does not change. Verify after rollout, it is load-bearing.
            #
            # Cost is ~33% more raw space, against 7.5% utilisation (352 GiB of
            # 4.5 TiB). Note this does NOT buy 2-node tolerance for the cluster
            # as a whole -- etcd still runs 3 control planes and tolerates 1.
            size: 4
        storageClass:
          allowVolumeExpansion: true
          enabled: true
          isDefault: true
          mountOptions: ["discard"]
          name: ceph-block
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            imageFormat: "2"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      deletionPolicy: Delete
      enabled: true
      isDefault: false
      name: csi-ceph-blockpool
    cephClusterSpec:
      # The rook orchestrator module logs every Kubernetes API response body at
      # DEBUG. A full PodList is ~1.5MiB and it polls every 15s (~6MiB/min,
      # ~8.6GiB/day). Loki rejected each one against its 256KiB max entry size
      # ("max entry size '262144' bytes exceeded ... entry with length
      # '1574250' bytes"), so ceph-mgr logs were dropped outright rather than
      # truncated — the active mgr was effectively unlogged.
      #
      # The option only takes effect when the module reloads, which the
      # 8-hourly `ceph mgr fail` in mgr-maintenance/ already does.
      cephConfig:
        mgr:
          mgr/rook/log_level: info
        osd:
          # BLUESTORE_SLOW_OP_ALERT ships hair-trigger defaults: a SINGLE op
          # over bluestore_log_op_age (5s) latches HEALTH_WARN for a full 24h
          # (threshold 1, lifetime 86400). One transient stall during a node
          # reboot or an OSD restart therefore parks the cluster in HEALTH_WARN
          # all day — which matters here because tuppr's TalosUpgrade gates on
          # `status.ceph.health in ['HEALTH_OK']`, so a stale blip silently
          # blocks node upgrades.
          #
          # Widen "slow" to 10s, require a handful of occurrences rather than
          # one, and let a one-off age out in an hour. A genuinely degraded
          # device produces slow ops continuously and still trips the alert;
          # only the single-sample latch is suppressed.
          bluestore_log_op_age: "10"
          bluestore_slow_ops_warn_threshold: "5"
          bluestore_slow_ops_warn_lifetime: "3600"
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
        ssl: false
        urlPrefix: /
      # Prevent node drains from causing data unavailability
      disruptionManagement:
        managePodBudgets: true
        osdMaintenanceTimeout: 30
        pgHealthCheckTimeout: 0
        manageMachineDisruptionBudgets: false
      mgr:
        modules:
          - enabled: true
            name: pg_autoscaler
          - enabled: true
            name: rook
          # Trim optional mgr modules to reduce active-mgr memory pressure after
          # the Ceph tentacle 20.2.2 upgrade started OOMKilling the active mgr
          # (grows to the 4Gi limit in ~14h). The prometheus module (usual leak
          # culprit) is already patched in 20.2.2 and tuned (exclude_perf_counters
          # true, rbd_stats_pools empty), so trim the other enabled-but-unused
          # modules: insights (chatty health_history writer), nfs (no exports /
          # CephNFS CRs), restful (legacy REST API, has its own historical leak).
          # See rook/rook#17786 (matching mgr OOM on rook 1.20 + ceph 20.2.2).
          - enabled: false
            name: insights
          - enabled: false
            name: nfs
          - enabled: false
            name: restful
      mon:
        # Five mons, not the chart default of three. Quorum needs a majority,
        # so 3 mons tolerate exactly ONE loss -- which would make the size 4
        # pools above pointless: the data would survive two hosts while the
        # monitors did not. 5 mons tolerate 2.
        #
        # Mons must land on distinct nodes for that to hold; there are 8, and
        # the `all` toleration below lets them use control planes too.
        count: 5
        allowMultiplePerNode: false
      network:
        connections:
          requireMsgr2: true
        provider: host
      placement:
        all:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
      storage:
        config:
          osdsPerDevice: "1"
        deviceFilter: nvme0n1
        useAllDevices: true
        useAllNodes: true
      resources:
        osd:
          limits:
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 2Gi
        # mgr memory keeps outgrowing its limit (1Gi -> 2Gi -> now 4Gi). The
        # insights / prometheus / dashboard modules warm up, and post-Ceph-
        # tentacle (v20) the cephfs volumes/nfs connection pool grows under
        # CSI/volsync subvolume clone load, spiking mgr-a to ~2Gi -> OOMKill.
        # Bump headroom; mgr is a singleton (mgr-b standby). If it still OOMs
        # at 4Gi, investigate the cephfs connection-pool leak / disable unused
        # modules (e.g. nfs) rather than raising further.
        mgr:
          limits:
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
    cephFileSystemVolumeSnapshotClass:
      deletionPolicy: Delete
      enabled: true
      isDefault: false
      name: csi-ceph-filesystem
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          dataPools:
            - failureDomain: host
              name: data0
              replicated:
                # See the ceph-blockpool comment: size 4 keeps PGs above
                # min_size when two hosts are lost.
                size: 4
          metadataPool:
            replicated:
              size: 4
          metadataServer:
            activeCount: 1
            activeStandby: true
            placement:
              topologySpreadConstraints:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: ceph-filesystem
                  maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 1Gi
        storageClass:
          allowVolumeExpansion: true
          enabled: true
          isDefault: false
          name: ceph-filesystem
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          pool: data0
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephObjectStores:
      - ingress:
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
          enabled: true
          host:
            name: rgw.${SECRET_DOMAIN}
            path: /
          ingressClassName: internal
        name: ceph-objectstore
        spec:
          dataPool:
            erasureCoded:
              codingChunks: 1
              dataChunks: 2
            failureDomain: host
          gateway:
            hostNetwork: false
            instances: 2
            port: 80
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 1Gi
          metadataPool:
            failureDomain: host
            replicated:
              # See the ceph-blockpool comment. Only the RGW *metadata* pool is
              # replicated; the bucket data pool below is erasure coded at
              # k=2,m=1 and still tolerates a single failure only. Raising that
              # to m=2 needs a NEW pool and a data migration -- EC profiles
              # cannot be changed in place -- so it is tracked separately.
              size: 4
          preservePoolsOnDelete: true
        storageClass:
          enabled: true
          name: ceph-bucket
          parameters:
            region: us-west-1
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    configOverride: |
      [global]
      bdev_enable_discard = true
      bdev_async_discard = true
      osd_class_update_on_start = false
    ingress:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Manage Rook-Ceph
          gethomepage.dev/group: Storage & Infrastructure
          gethomepage.dev/icon: rook.png
          gethomepage.dev/name: Rook/Ceph
          gethomepage.dev/pod-selector: mgr=a
        host:
          name: rook.${SECRET_DOMAIN}
          path: /
        ingressClassName: internal
    monitoring:
      createPrometheusRules: true
      enabled: true
      prometheusRuleOverrides:
        CephPGImbalance:
          disabled: true
    toolbox:
      enabled: true
  driftDetection:
    mode: enabled
