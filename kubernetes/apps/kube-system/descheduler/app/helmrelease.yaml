---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: descheduler
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicas: 2
    kind: Deployment
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictFailedBarePods: true
                evictLocalStoragePods: true
                evictSystemCriticalPods: true
                nodeFit: true
                # Never evict GitHub Actions runner pods: each one is a single
                # in-flight CI job, and eviction cancels it ("runner has received
                # a shutdown signal"). Their soft topology spread made
                # RemovePodsViolatingTopologySpreadConstraint kill jobs mid-run.
                labelSelector:
                  matchExpressions:
                    - key: actions-ephemeral-runner
                      operator: DoesNotExist
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            # cilium-operator (set-cilium-node-taints) puts this NoSchedule taint
            # on a node while its agent restarts; it is gone within seconds.
            # Without the exclusion every cilium roll evicted unrelated pods
            # (komga, komf, manyfold on 2026-09-29) mid-rollout.
            - name: RemovePodsViolatingNodeTaints
              args:
                excludedTaints:
                  - node.cilium.io/agent-not-ready
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                constraints:
                  - DoNotSchedule
                  - ScheduleAnyway
            # Rebalances pods away from over-allocated nodes. Without this,
            # a partial outage permanently skews placement: pods pile onto
            # whichever nodes stayed up and never move back once the others
            # return, because the scheduler only places new pods. Seen
            # 2026-08-09 after a full restart -- mj04ew44 held 70 pods while
            # mj0581m7 held 16, and postgres16-4 (openebs-hostpath, pinned to
            # mj0581rw at 87% cpu / 88% mem) could not schedule at all,
            # blocking 9 Kustomizations behind the CNPG health check.
            # Self-heal EMQX core split-brain. After rolling node reboots a core
            # can come back with a Mnesia schema that no longer merges with the
            # others ("inconsistent_database, starting_partitioned_network" ->
            # "FATAL Failed to merge schema") and crash-loops forever: its data
            # is an emptyDir, which survives container restarts, so every
            # restart reloads the bad schema. Evicting the pod gives it a fresh
            # emptyDir and it rejoins the healthy cores at once.
            # This matters beyond MQTT: while one core is down the emqx-core
            # PDB (maxUnavailable 1) allows 0 disruptions, so every node drain
            # stalls on the next EMQX pod. On 2026-11-12 that made tuppr's
            # Talos upgrade job time out without rebooting, leaving mj0581rw
            # cordoned. Scoped to crash-looping EMQX core pods only.
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 5
                includingInitContainers: true
                states:
                  - CrashLoopBackOff
                namespaces:
                  include:
                    - database
                labelSelector:
                  matchLabels:
                    apps.emqx.io/instance: emqx
                    apps.emqx.io/db-role: core
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 30
                  memory: 30
                  pods: 30
                targetThresholds:
                  cpu: 70
                  memory: 70
                  pods: 70
          plugins:
            balance:
              enabled:
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
                - RemovePodsHavingTooManyRestarts
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  driftDetection:
    mode: enabled
