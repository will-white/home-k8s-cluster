---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: reloader
      version: 2.2.17
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: reloader
    reloader:
      readOnlyRootFileSystem: true
      podMonitor:
        enabled: true
        namespace: "{{ .Release.Namespace }}"
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 832Mi
  driftDetection:
    mode: enabled
