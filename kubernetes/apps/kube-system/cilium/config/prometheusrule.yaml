---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-rules
spec:
  groups:
    - name: cilium.rules
      rules:
        - alert: CiliumAgentUnreachableHealthEndpoint
          annotations:
            summary: Cilium agent on {{ $labels.node }} cannot reach health endpoints
            description: >-
              Cilium agent on node {{ $labels.node }} has unreachable nodes for more than 5 minutes.
              This may indicate network partitioning or a failed CNI on that node.
          expr: cilium_unreachable_nodes > 0
          for: 5m
          labels:
            severity: warning
        - alert: CiliumAgentUnhealthy
          annotations:
            summary: Cilium agent on {{ $labels.node }} is not running
            description: >-
              The Cilium agent pod on node {{ $labels.node }} has not been healthy for more than 3 minutes.
          expr: cilium_agent_api_process_time_seconds_count == 0
          for: 3m
          labels:
            severity: critical
        - alert: CiliumEndpointNotReady
          annotations:
            summary: Cilium endpoints not ready on {{ $labels.node }}
            description: >-
              Node {{ $labels.node }} has {{ $value }} Cilium endpoints stuck in a not-ready state
              for more than 10 minutes.
          expr: cilium_endpoint_state{endpoint_state="not-ready"} > 0
          for: 10m
          labels:
            severity: warning
        - alert: CiliumEndpointRegenerationFailures
          annotations:
            summary: Cilium endpoint regeneration failures on {{ $labels.node }}
            description: >-
              Cilium on node {{ $labels.node }} has experienced endpoint regeneration
              failures in the last 15 minutes.
          expr: rate(cilium_endpoint_regenerations_total{outcome="fail"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
        - alert: CiliumIdentityAllocationFailures
          annotations:
            summary: Cilium identity allocation failures on {{ $labels.node }}
            description: >-
              Cilium on node {{ $labels.node }} is failing to allocate identities,
              which may impact network policy enforcement.
          expr: rate(cilium_identity_count{type="error"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
    # BGP with OPNsense (cilium-bgp.yaml). Since the Gateways, Postgres, EMQX,
    # go2rtc and tdarr moved to 192.168.110.0/24, these routes are the only way
    # anything outside the cluster reaches them. In-cluster probes (Gatus,
    # blackbox) skip the router and stay green when BGP is down.
    - name: cilium-bgp.rules
      rules:
        - alert: CiliumBGPSessionDown
          annotations:
            summary: BGP session from {{ $labels.node }} to {{ $labels.neighbor }} is down
            description: >-
              Node {{ $labels.node }} has no established BGP session with OPNsense.
              OPNsense stops routing Service IPs via this node; other nodes still
              carry them. Check `vtysh -c 'show bgp ipv4 unicast summary'` on the
              router and the cilium-agent logs on the node.
          expr: cilium_bgp_control_plane_session_state != 1
          for: 2m
          labels:
            severity: warning
        - alert: CiliumBGPAllSessionsDown
          annotations:
            summary: No node has a BGP session with OPNsense
            description: >-
              Every Service in the BGP pool (192.168.110.0/24: Gateways, Postgres,
              MQTT, go2rtc, tdarr) is unreachable from outside the cluster.
              Check FRR on OPNsense first (Routing → Diagnostics → BGP).
          expr: count(cilium_bgp_control_plane_session_state == 1) == 0 or absent(cilium_bgp_control_plane_session_state)
          for: 1m
          labels:
            severity: critical
        - alert: CiliumBGPNoRoutesAdvertised
          annotations:
            summary: Cilium advertises no BGP routes
            description: >-
              Sessions are up but no node advertises any route, so OPNsense has
              nothing to send to the BGP pool. Check the lb-pool=bgp Services
              and CiliumBGPAdvertisement bgp-services.
          expr: sum(cilium_bgp_control_plane_advertised_routes) == 0
          for: 5m
          labels:
            severity: critical
