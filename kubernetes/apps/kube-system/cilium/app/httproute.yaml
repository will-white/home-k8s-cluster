---
# The cilium chart only knows Ingress for hubble-ui, so the route lives here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - hubble.${SECRET_DOMAIN}
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
      timeouts:
        request: 0s
