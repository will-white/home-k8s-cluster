---
# apiserver -> operator admission webhooks (both verified on 9443): CNPG
# validates every Cluster/Backup/ScheduledBackup apply; the EMQX operator
# validates its CRs. Same Cilium kube-apiserver-entity pattern as phases 1-3.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cnpg-webhook-from-apiserver
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-emqx-webhook-from-apiserver
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: emqx-operator
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
