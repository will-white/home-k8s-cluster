---
# Client namespaces of the shared datastores: Postgres (media *arrs,
# default apps, observability gatus, litellm), EMQX MQTT (default HA stack),
# Dragonfly. LAN clients (ambientweather -> MQTT LB, external Postgres
# clients -> POSTGRES_LB) come in via allow-ingress-lan instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-client-namespaces
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
