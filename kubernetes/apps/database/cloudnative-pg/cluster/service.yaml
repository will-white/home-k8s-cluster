apiVersion: v1
kind: Service
metadata:
  name: postgres-lb
  labels:
    # Routed BGP pool (kube-system/cilium/config/cilium-bgp.yaml)
    lb-pool: bgp
  annotations:
    external-dns.alpha.kubernetes.io/hostname: postgres.${SECRET_DOMAIN}
    lbipam.cilium.io/ips: ${POSTGRES_LB}
spec:
  type: LoadBalancer
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres16
    cnpg.io/instanceRole: primary
