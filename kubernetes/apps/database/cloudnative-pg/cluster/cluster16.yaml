apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
spec:
  instances: 3
  # standard flavor (no barman binary — WAL archiving runs in the plugin
  # sidecar); bookworm pinned to keep glibc/collation stable for indexes.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.14-standard-bookworm
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "250"
      shared_buffers: 128MB
  resources:
    requests:
      cpu: 500m
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true
  # WAL archiving + base backups via the barman-cloud CNPG-I plugin
  # (in-tree barmanObjectStore is deprecated, removed in CNPG 1.31).
  # Store config lives in objectstore.yaml; retentionPolicy moved there too.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ceph-rgw
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: postgres16-v1
