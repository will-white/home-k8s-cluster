---
groups:
  - name: emqx
    rules:
      # Catches the partition at the moment it happens. EMQX logs it once and
      # then stays broken silently, so this is the early warning and the
      # EMQXClusterPartitioned Prometheus rule is the durable state alert —
      # keep both. The previous regex here ("mnesia .+ error", "node .+ down")
      # matched none of EMQX's real output and stayed inactive through a full
      # cluster partition on 2026-09-09.
      - alert: EMQXClusterPartition
        expr: |
          sum(count_over_time({namespace="database", app=~"emqx.*"} |~ "(?i)(core cluster partition|running_partitioned_network|inconsistent_database|partition occurs at node)"[5m])) > 0
        for: 0m
        labels:
          severity: critical
          category: logs
        annotations:
          app: "emqx"
          summary: "EMQX logged a cluster partition — brokers are diverging, MQTT clients may be isolated"

      - alert: EMQXNodeDown
        expr: |
          sum(count_over_time({namespace="database", app=~"emqx.*"} |~ "(?i)(cm_registry_node_down|cm_registry_mnesia_down|not responding)"[5m])) > 0
        for: 2m
        labels:
          severity: critical
          category: logs
        annotations:
          app: "emqx"
          summary: "EMQX lost contact with a cluster node"

      - alert: EMQXAuthenticationFailure
        expr: |
          sum(count_over_time({namespace="database", app=~"emqx.*"} |~ "(?i)(authentication failure|client .+ banned|login failed)"[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: logs
        annotations:
          app: "emqx"
          summary: "EMQX is seeing elevated authentication failures"
