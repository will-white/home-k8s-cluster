---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-ops-runner
spec:
  chartRef:
    kind: OCIRepository
    name: home-ops-runner
  interval: 1h
  values:
    githubConfigUrl: https://github.com/will-white/home-k8s-cluster
    githubConfigSecret: home-ops-runner-secret
    # `runs-on: home-ops-runner` in workflow files targets this scale set.
    runnerScaleSetName: home-ops-runner
    minRunners: 1
    # A kubernetes/** PR fires 7 self-hosted jobs at once; 8 lets the whole
    # suite run in parallel with one spare (~500m/512Mi requested per runner).
    maxRunners: 8
    # dind because flux-diff runs `docker://` container actions.
    containerMode:
      type: dind
    # Explicit — the chart's cluster-lookup autodiscovery breaks flux-local
    # (CI flux-diff) which templates without cluster access.
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 4Gi
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
