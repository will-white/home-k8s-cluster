---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: host-network-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: host-network-proxy
  install:
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Why this exists: the Cilium Gateway's envoy cannot connect to a
    # hostNetwork backend running on its own node (503 UF "connection
    # timeout", ~1 request in 8 with 8 nodes). home-assistant and
    # music-assistant are hostNetwork, so their HTTPRoutes point here instead:
    # a plain pod that forwards to the apps' existing Services. The apps stay
    # on the host network (mDNS, Matter, Sonos/Chromecast discovery and the
    # :8097 stream port are untouched). Remove this app and restore the
    # HTTPRoute backendRefs once Cilium fixes same-node host-network backends.
    controllers:
      host-network-proxy:
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: host-network-proxy
        containers:
          app:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8095
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
    configMaps:
      config:
        data:
          nginx.conf: |
            worker_processes auto;
            pid /tmp/nginx.pid;
            error_log /dev/stderr warn;
            events { worker_connections 1024; }
            http {
              access_log off;
              client_body_temp_path /tmp/client_temp;
              proxy_temp_path /tmp/proxy_temp;
              fastcgi_temp_path /tmp/fastcgi_temp;
              uwsgi_temp_path /tmp/uwsgi_temp;
              scgi_temp_path /tmp/scgi_temp;

              map $http_upgrade $connection_upgrade {
                default upgrade;
                ""      close;
              }

              # Shared by all three servers. X-Forwarded-* are passed through
              # from the Cilium Gateway unchanged so the apps see what they
              # saw when the Gateway talked to them directly.
              # Resolve at request time so nginx starts even before the
              # upstream Services exist (home-assistant / music-assistant
              # depend on this app).
              resolver 10.96.0.10 valid=30s ipv6=off;
              proxy_http_version 1.1;
              proxy_set_header Host $http_host;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header X-Forwarded-For $http_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
              proxy_set_header X-Request-Id $http_x_request_id;
              proxy_buffering off;
              proxy_request_buffering off;
              proxy_connect_timeout 10s;
              proxy_read_timeout 1h;
              proxy_send_timeout 1h;
              client_max_body_size 0;

              server {
                listen 8123;
                set $upstream http://home-assistant.default.svc.cluster.local:8123;
                location / { proxy_pass $upstream; }
              }
              server {
                listen 12321;
                set $upstream http://home-assistant.default.svc.cluster.local:12321;
                location / { proxy_pass $upstream; }
              }
              server {
                listen 8095;
                set $upstream http://music-assistant.default.svc.cluster.local:8095;
                location / { proxy_pass $upstream; }
              }
            }
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: host-network-proxy
        ports:
          ha:
            port: 8123
          ha-code-server:
            port: 12321
          music-assistant:
            port: 8095
  driftDetection:
    mode: enabled
