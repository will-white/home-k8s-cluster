apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homebox-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        HBOX_DATABASE_DATABASE: &dbName homebox
        HBOX_DATABASE_HOST: &dbHost postgres16-rw.database.svc.cluster.local
        HBOX_DATABASE_PORT: "5432"
        HBOX_DATABASE_PASSWORD: &dbPass "{{ .HOMEBOX_POSTGRES_PASSWORD }}"
        HBOX_DATABASE_USERNAME: &dbUser "{{ .HOMEBOX_POSTGRES_USER }}"
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPERUSER_PASSWORD }}"
        HBOX_AUTH_API_KEY_PEPPER: "{{ .HOMEBOX_PEPPER }}"
  data:
    - secretKey: HOMEBOX_POSTGRES_PASSWORD
      remoteRef:
        key: HOMEBOX_POSTGRES_PASSWORD
    - secretKey: HOMEBOX_POSTGRES_USER
      remoteRef:
        key: HOMEBOX_POSTGRES_USER
    - secretKey: POSTGRES_SUPERUSER_PASSWORD
      remoteRef:
        key: POSTGRES_SUPERUSER_PASSWORD
    - secretKey: HOMEBOX_PEPPER
      remoteRef:
        key: HOMEBOX_PEPPER
