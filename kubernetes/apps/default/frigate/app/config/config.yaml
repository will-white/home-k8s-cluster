version: 0.16-0

auth:
  enabled: false

tls:
  enabled: false

mqtt:
  host: emqx-listeners.database.svc.cluster.local
  topic_prefix: frigate
  user: "{FRIGATE_MQTT_USERNAME}"
  password: "{FRIGATE_MQTT_PASSWORD}"

database:
  path: /data/frigate.db

detectors:
  coral:
    type: edgetpu
    device: pci

ffmpeg:
  global_args: [-hide_banner, -loglevel, info]
  hwaccel_args: preset-vaapi

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  retain:
    default: 7

record:
  enabled: true
  # NOTE: top-level `record.retain` was removed in Frigate 0.14+.
  # Retention is configured per-category below.
  # Rolling 24h of continuous footage for every camera; alert/detection
  # clips are kept for 7 days on top of that.
  continuous:
    days: 1
  alerts:
    # Detection can lag the actual event, so keep a generous lead-in.
    pre_capture: 15
    post_capture: 10
    retain:
      days: 7
  detections:
    pre_capture: 15
    post_capture: 10
    retain:
      days: 7

objects:
  track: [person, dog, car]
  filters:
    person:
      threshold: 0.75
      min_score: 0.70
    dog:
      threshold: 0.75
      min_score: 0.70
    car:
      threshold: 0.75
      min_score: 0.70

review:
  alerts:
    labels:
      - person
      - dog
      - car
  detections:
    labels:
      - bark
      - speech
      - shatter
      - fire_alarm
      - scream

audio:
  enabled: false
  listen:
    - bark
    - fire_alarm
    - scream
    - speech
    - yell
    - shatter

birdseye:
  enabled: true
  # `continuous` keeps every camera encoding into the birdseye view around
  # the clock; `motion` only composites cameras with active motion.
  mode: motion

cameras:
  doorbell:
    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: true
      height: 175
      quality: 70
    detect:
      enabled: true
      width: 1280
      height: 960
      fps: 10
    audio:
      enabled: true
      listen:
        - bark
        - speech
        - yell
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://go2rtc.default.svc.cluster.local:8554/doorbell
          input_args: preset-rtsp-restream-low-latency
          roles:
            - record
            - detect
            - audio
    motion:
      mask: 0.68,0.302,1,0.095,1,0,0.803,0,0.681,0.262
  camera1:
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc.default.svc.cluster.local:8554/camera1
          input_args: preset-rtsp-restream
          roles:
            - record
  mechanical:
    audio:
      enabled: true
      listen:
        - shatter
        - fire_alarm
        - scream
        - yell
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc.default.svc.cluster.local:8554/mechanical
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
