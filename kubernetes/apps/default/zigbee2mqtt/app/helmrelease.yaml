---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: zigbee2mqtt
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  install:
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      zigbee2mqtt:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            env:
              TZ: ${TIMEZONE}
              # Enable watchdog for automatic recovery from adapter disconnects
              # Retries at: 1min, 5min, 15min, 30min, 60min before giving up
              Z2M_WATCHDOG: default
              # ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL: debug
              ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: true
              ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: 80
              ZIGBEE2MQTT_CONFIG_FRONTEND_URL: http://zigbee2mqtt.default.svc.cluster.local
              ZIGBEE2MQTT_CONFIG_MQTT_INCLUDE_DEVICE_INFORMATION: true
              ZIGBEE2MQTT_CONFIG_MQTT_KEEPALIVE: 60
              ZIGBEE2MQTT_CONFIG_MQTT_REJECT_UNAUTHORIZED: true
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://emqx-listeners.database.svc.cluster.local
              ZIGBEE2MQTT_CONFIG_MQTT_VERSION: 5
              ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ember
              ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE: 115200
              # Radio 1 (EFR32MG24) of the SLZB-Ultima3, which also carries Thread
              # (:7638) and Z-Wave (:9638). Migrated off the SLZB-06M 2026-10-19 by
              # an Ember backup restore (same PAN/key/frame counter), no re-pairing.
              # The restore did NOT carry the coordinator IEEE (0x00124b0026b88196):
              # routers then saw 0x0000 under a new IEEE, logged
              # ROUTE_ERROR_ADDRESS_CONFLICT, and the NCP hit RESET_ASSERT in a loop.
              # Fixed with SLZB-OS's IEEE write (/api2?action=4&cmd=11&ieee=0x...).
              # Next coordinator swap: write the IEEE before pointing Z2M at it.
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: tcp://slzb-ultima3.internal:6638
              ZIGBEE2MQTT_DATA: /config
            envFrom:
              - secretRef:
                  name: zigbee2mqtt-secret
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 10m
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    route:
      app:
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Smart Home
          gethomepage.dev/icon: zigbee2mqtt.png
          gethomepage.dev/name: Zigbee
        hostnames:
          - zigbee.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
            timeouts:
              request: 0s
    persistence:
      config:
        existingClaim: zigbee2mqtt
    service:
      app:
        controller: zigbee2mqtt
        type: LoadBalancer
        ports:
          http:
            port: 80
  driftDetection:
    mode: enabled
