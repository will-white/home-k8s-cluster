---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homepage-secret
spec:
  data:
    - secretKey: HOMEPAGE_ADGUARD_PASSWORD
      remoteRef:
        key: HOMEPAGE_ADGUARD_PASSWORD
    - secretKey: HOMEPAGE_ADGUARD_USERNAME
      remoteRef:
        key: HOMEPAGE_ADGUARD_USERNAME
    - secretKey: AUTOBRR_API_KEY
      remoteRef:
        key: AUTOBRR_API_KEY
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: BAZARR_API_KEY
    - secretKey: CLOUDFLARE_ACCOUNT_TAG
      remoteRef:
        key: CLOUDFLARE_ACCOUNT_TAG
    - secretKey: CLOUDFLARE_API_KEY
      remoteRef:
        key: CLOUDFLARE_API_KEY
    - secretKey: CLOUDFLARE_TUNNEL_ID
      remoteRef:
        key: CLOUDFLARE_TUNNEL_ID
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD
    - secretKey: GRAFANA_ADMIN_USERNAME
      remoteRef:
        key: GRAFANA_ADMIN_USERNAME
    - secretKey: HASS_TOKEN
      remoteRef:
        key: HASS_TOKEN
    - secretKey: HOMEPAGE_KAVITA_API_KEY
      remoteRef:
        key: HOMEPAGE_KAVITA_API_KEY
    - secretKey: HOMEPAGE_MEALIE_API_KEY
      remoteRef:
        key: HOMEPAGE_MEALIE_API_KEY
    - secretKey: HOMEPAGE_OPNSENSE_PASSWORD
      remoteRef:
        key: HOMEPAGE_OPNSENSE_PASSWORD
    - secretKey: HOMEPAGE_OPNSENSE_USERNAME
      remoteRef:
        key: HOMEPAGE_OPNSENSE_USERNAME
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: SEERR_API_KEY
    - secretKey: PORTAINER_TOKEN
      remoteRef:
        key: PORTAINER_TOKEN
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: PROWLARR_API_KEY
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: QBITTORRENT_PASSWORD
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: QBITTORRENT_USERNAME
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: SONARR_API_KEY
    - secretKey: HOMEPAGE_TRUENAS_PASSWORD
      remoteRef:
        key: HOMEPAGE_TRUENAS_PASSWORD
    - secretKey: HOMEPAGE_TRUENAS_USERNAME
      remoteRef:
        key: HOMEPAGE_TRUENAS_USERNAME
    - secretKey: HOMEPAGE_UNIFI_PASSWORD
      remoteRef:
        key: HOMEPAGE_UNIFI_PASSWORD
    - secretKey: HOMEPAGE_UNIFI_USERNAME
      remoteRef:
        key: HOMEPAGE_UNIFI_USERNAME
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      data:
        HOMEPAGE_VAR_ADGUARD_PASSWORD: "{{ .HOMEPAGE_ADGUARD_PASSWORD }}"
        HOMEPAGE_VAR_ADGUARD_USERNAME: "{{ .HOMEPAGE_ADGUARD_USERNAME }}"
        HOMEPAGE_VAR_AUTOBRR_API_KEY: "{{ .AUTOBRR_API_KEY }}"
        HOMEPAGE_VAR_BAZARR_API_KEY: "{{ .BAZARR_API_KEY }}"
        HOMEPAGE_VAR_CLOUDFLARED_ACCOUNTID: "{{ .CLOUDFLARE_ACCOUNT_TAG }}"
        HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN: "{{ .CLOUDFLARE_API_KEY }}"
        HOMEPAGE_VAR_CLOUDFLARED_TUNNELID: "{{ .CLOUDFLARE_TUNNEL_ID }}"
        HOMEPAGE_VAR_GRAFANA_PASSWORD: "{{ .GRAFANA_ADMIN_PASSWORD }}"
        HOMEPAGE_VAR_GRAFANA_USERNAME: "{{ .GRAFANA_ADMIN_USERNAME }}"
        HOMEPAGE_VAR_HASS_TOKEN: "{{ .HASS_TOKEN }}"
        HOMEPAGE_VAR_KAVITA_API_KEY: "{{ .HOMEPAGE_KAVITA_API_KEY }}"
        HOMEPAGE_VAR_MEALIE_API_KEY: "{{ .HOMEPAGE_MEALIE_API_KEY }}"
        HOMEPAGE_VAR_OPNSENSE_PASSWORD: "{{ .HOMEPAGE_OPNSENSE_PASSWORD }}"
        HOMEPAGE_VAR_OPNSENSE_USERNAME: "{{ .HOMEPAGE_OPNSENSE_USERNAME }}"
        HOMEPAGE_VAR_SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        HOMEPAGE_VAR_PORTAINER_TOKEN: "{{ .PORTAINER_TOKEN }}"
        HOMEPAGE_VAR_PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_QBITTORRENT_PASSWORD: "{{ .QBITTORRENT_PASSWORD }}"
        HOMEPAGE_VAR_QBITTORRENT_USERNAME: "{{ .QBITTORRENT_USERNAME }}"
        HOMEPAGE_VAR_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        HOMEPAGE_VAR_TRUENAS_PASSWORD: "{{ .HOMEPAGE_TRUENAS_PASSWORD }}"
        HOMEPAGE_VAR_TRUENAS_USERNAME: "{{ .HOMEPAGE_TRUENAS_USERNAME }}"
        HOMEPAGE_VAR_UNIFI_PASSWORD: "{{ .HOMEPAGE_UNIFI_PASSWORD }}"
        HOMEPAGE_VAR_UNIFI_USERNAME: "{{ .HOMEPAGE_UNIFI_USERNAME }}"
      engineVersion: v2
