apiVersion: v1
data:
  bookmarks.yaml: |
    - Git:
        - kubesearch:
            - icon: kubernetes-dashboard.png
              href: 'https://kubesearch.dev/'
        - home-ops:
            - icon: github.png
              href: 'https://github.com/will-white/home-k8s-cluster'
        - dashboard-icons:
            - icon: github.png
              href: 'https://github.com/walkxcode/dashboard-icons/blob/main/ICONS.md'
    - Media Resources:
        - Releases.moe:
            - icon: https://releases.moe/favicon.ico
              href: 'https://releases.moe'
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  services.yaml: |
    # Services are auto-discovered via gethomepage.dev annotations on HTTPRoutes
    # Only services without an HTTPRoute need to be defined here
    - Calendar:
        - Agenda:
            widget:
              type: calendar
              view: agenda
              maxEvents: 5
              integrations:
                - type: sonarr
                  service_group: Automation
                  service_name: Sonarr
                - type: radarr
                  service_group: Automation
                  service_name: Radarr
    - Network:
        # UniFi only serves HTTPS with a self-signed cert, which Gateway API
        # cannot proxy without a BackendTLSPolicy + trusted cert. Reach it on
        # its own LoadBalancer Service until that lands.
        - UniFi:
            href: https://unifi-mgmt.${SECRET_DOMAIN}:8443
            icon: unifi.png
            description: Unifi Dashboard
            widget:
              type: unifi
              url: https://unifi.default:8443
              username: {{HOMEPAGE_VAR_UNIFI_USERNAME}}
              password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
        - Cloudflared:
            href: https://dash.cloudflare.com/
            icon: cloudflare-zero-trust.png
            description: Cloudflare tunnel
            widget:
              type: cloudflared
              accountid: {{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNTID}}
              tunnelid: {{HOMEPAGE_VAR_CLOUDFLARED_TUNNELID}}
              key: {{HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN}}
              fields: ["status"]
    - Storage & Infrastructure:
        - TrueNAS:
            href: https://nas.${SECRET_DOMAIN}
            icon: truenas-scale.png
            description: NAS storage
        - S3:
            href: https://s3.${SECRET_DOMAIN}
            icon: minio.png
            description: S3 object storage
        - Portainer:
            href: https://portainer.${SECRET_DOMAIN}
            icon: portainer.png
            description: Docker management
        - Netboot:
            href: https://netboot.${SECRET_DOMAIN}
            icon: netboot.png
            description: PXE boot server
  settings.yaml: |
    title: Dashboard
    favicon: https://github.com/walkxcode/dashboard-icons/blob/main/png/heimdall.png
    useEqualHeights: true
    theme: dark
    color: slate
    headerStyle: clean
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: true
      hideVisitURL: true
    layout:
      Books:
        tab: Home
        icon: mdi-bookshelf
        style: row
        columns: 3
      Audio:
        tab: Home
        icon: mdi-headphones
        style: row
        columns: 2
      Request & Discover:
        tab: Home
        icon: mdi-magnify-plus
        style: row
        columns: 4
      Downloads:
        tab: Home
        icon: mdi-download-circle
        style: row
        columns: 3
      Automation:
        tab: Home
        icon: mdi-robot
        style: row
        columns: 4
      Smart Home:
        tab: Home
        icon: mdi-home-automation
        style: row
        columns: 4
      Productivity:
        tab: Home
        icon: mdi-text-box-check
        style: row
        columns: 4
      Tools:
        tab: Home
        icon: mdi-tools
        style: row
        columns: 4
      Calendar:
        tab: Home
        icon: mdi-calendar
        style: row
        columns: 1
        header: false
      Network:
        tab: Infrastructure
        icon: mdi-network
        style: row
        columns: 2
      Cluster & Observability:
        tab: Infrastructure
        icon: mdi-kubernetes
        style: row
        columns: 5
      Storage & Infrastructure:
        tab: Infrastructure
        icon: mdi-server
        style: row
        columns: 4
  widgets.yaml: |
    - kubernetes:
        cluster:
          cpu: true
          label: cluster
          memory: true
          show: true
          showLabel: true
        nodes:
          cpu: true
          memory: true
          show: true
          showLabel: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: homepage
  name: homepage-config
