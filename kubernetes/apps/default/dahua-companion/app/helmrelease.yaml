---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dahua-companion
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: dahua-companion
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: emqx
      namespace: database
  values:
    controllers:
      dahua-companion:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/will-white/dahua-companion
              tag: v0.6.1@sha256:7882d343d8f4a5ad04156fa2f67df9f41b8358b839b1c2a6f469650dfb7677ec
            env:
              MQTT_BROKER_URL: tcp://emqx-listeners.database.svc.cluster.local:1883
              MQTT_CLIENT_ID: dahua-companion
              # Home Assistant auto-creates the doorbell device (ring + person
              # event entities, "Last ring"/"Last person" image entities).
              MQTT_DISCOVERY_PREFIX: homeassistant
              MQTT_PAYLOAD_FORMAT: json
              SNAPSHOT: press,human
            envFrom:
              - secretRef:
                  name: dahua-companion-secret
            probes:
              # /health runs a live camera probe, so it must not gate liveness:
              # a flaky doorbell would restart a healthy process, and a restart
              # cannot bring the camera back. Liveness checks the process only;
              # camera reachability is reported through readiness.
              liveness: &processProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 10
                  timeoutSeconds: 5
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  # /health bounds its camera probe at 5s; stay above that so
                  # kubelet does not give up at the same moment the probe does.
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              # Startup must also ignore the camera, or a doorbell that is down
              # at boot would stop the pod from ever starting.
              startup: *processProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: dahua-companion
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: dahua-companion
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
  driftDetection:
    mode: enabled
