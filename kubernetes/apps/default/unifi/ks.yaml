apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unifi
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
    - name: volsync
  path: ./kubernetes/apps/default/unifi/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_URL: https://unifi.default.svc.cluster.local:8443/status
      VOLSYNC_BOOTSTRAP_SOURCE_NAMESPACE: default
      VOLSYNC_CAPACITY: 10Gi
      # explicit: matches the live PVC class (claim class is immutable)
      PVC_VOLSYNC_STORAGECLASS: ceph-block
      # Stats DB writes constantly but losing a few hours of network stats is
      # acceptable. Back up every 6 hours instead of hourly.
      VOLSYNC_SCHEDULE: "0 */6 * * *"
      NAMESPACE: default
