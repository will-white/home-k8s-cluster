apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app manyfold
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
    - name: volsync
  path: ./kubernetes/apps/default/manyfold/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: default
      GATUS_PORT: "3214"
      # "/" bounces through the Rails auth flow (/users/sign_in -> /dashboard -> ...).
      # Gatus follows redirects without persisting the session cookie, so the probe
      # loops until its client timeout. /health answers 200 directly.
      GATUS_PATH: /health
      VOLSYNC_BOOTSTRAP_SOURCE_NAMESPACE: default
      VOLSYNC_CAPACITY: 5Gi
