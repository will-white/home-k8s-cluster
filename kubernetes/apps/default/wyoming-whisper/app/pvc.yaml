---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/_/persistentvolumeclaim_v1.json
# Model cache only (re-downloaded from HuggingFace on loss), so a plain PVC
# rather than the volsync template.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyoming-whisper
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  storageClassName: ceph-block
