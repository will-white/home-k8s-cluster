---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Cluster & Observability
    gethomepage.dev/name: Headlamp
    gethomepage.dev/icon: headlamp.png
    gethomepage.dev/description: Kubernetes Web UI
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - headlamp.${SECRET_DOMAIN}
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
      timeouts:
        request: 0s
