---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      A mutable tag defeats Renovate's digest pinning and makes rollbacks
      guesswork. Every container image must carry an explicit, non-latest tag.
spec:
  validationActions: ["Audit"]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  # Autogen only for top-level controllers: ReplicaSet/Job copies triple-count
  # every failure (old zero-replica ReplicaSets included). Bare Pods are
  # still checked by the Pod rule itself.
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets", "cronjobs"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kyverno"]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    # require-image-tag
    - expression: "variables.containers.all(c, c.image.contains(':'))"
      message: "An image tag is required."
      messageExpression: >-
        'An image tag is required (image: ' +
        variables.containers.filter(c, !c.image.contains(':')).map(c, c.image).join(', ') + ').'
    # validate-image-tag
    - expression: >-
        variables.containers.all(c, !c.image.endsWith(':latest') && !c.image.contains(':latest@'))
      message: "Using a mutable image tag (latest) is not allowed."
