---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Require Image Digest
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Renovate pins every image to a digest (renovate.json5 pinDigests). This
      reports any container that slipped through with a tag only, so the
      running image is always exactly the one reviewed in Git.
spec:
  validationActions: ["Audit"]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  # Autogen only for top-level controllers: ReplicaSet/Job copies triple-count
  # every failure (old zero-replica ReplicaSets included). Bare Pods are
  # still checked by the Pod rule itself.
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets", "cronjobs"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kyverno"]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - expression: "variables.containers.all(c, c.image.contains('@sha256:'))"
      message: "Images must be pinned to a digest (image@sha256:...)."
      messageExpression: >-
        'Images must be pinned to a digest (image@sha256:...): ' +
        variables.containers.filter(c, !c.image.contains('@sha256:')).map(c, c.image).join(', ')
