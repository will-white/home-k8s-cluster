---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: kyverno
      version: 3.9.2
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Every policy in ../policies/app is Audit-only, and this makes the
    # admission webhooks fail open: a Kyverno outage never blocks the API
    # server. Flip both deliberately when a policy graduates to Enforce.
    features:
      forceFailurePolicyIgnore:
        enabled: true
      policyReports:
        enabled: true
      # PolicyViolation events on every audited workload drowned the Warning
      # event stream; policy reports and the Grafana dashboard track results.
      omitEvents:
        eventTypes:
          - PolicyApplied
          - PolicySkipped
          - PolicyViolation
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values: ["kube-system", "kyverno"]
    admissionController:
      replicas: 1
      container:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
      serviceMonitor:
        enabled: true
    backgroundController:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        enabled: true
    reportsController:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 512Mi
      serviceMonitor:
        enabled: true
    cleanupController:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        enabled: true
    # The chart's dashboard ConfigMap lands in observability where the
    # Grafana sidecar watches (grafana_dashboard: "1" label is the default).
    grafana:
      enabled: true
      namespace: observability
      annotations:
        grafana_folder: Kyverno
  driftDetection:
    mode: enabled
