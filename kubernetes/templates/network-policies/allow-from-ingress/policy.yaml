---
# Allow ingress from the Cilium Gateway API data path. Gateway traffic is
# proxied by the cilium-envoy DaemonSet (host network, kube-system) and reaches
# backend pods with Cilium's reserved `ingress` identity, which a plain
# NetworkPolicy cannot select -- hence a CiliumNetworkPolicy. KNP and CNP allow
# rules are unioned, so the default-deny KNP in each namespace still applies.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-from-ingress
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
