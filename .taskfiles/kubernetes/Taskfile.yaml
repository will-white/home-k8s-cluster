---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  KUBECONFORM_SCRIPT: "{{.SCRIPTS_DIR}}/kubeconform.sh"

tasks:

  apply-ks:
    desc: Apply a Flux KS for a cluster [PATH=required]
    cmd: >
      flux build --namespace flux-system ks {{base .PATH}}
      --kustomization-file {{.KUBERNETES_DIR}}/apps/{{.PATH}}/ks.yaml
      --path {{.KUBERNETES_DIR}}/apps/{{.PATH}}{{- if contains "not found" .KS }}--dry-run \{{ end }}
      | yq 'with(select(.apiVersion == "kustomize.toolkit.fluxcd.io/v1" and .kind == "Kustomization"); .metadata.namespace = "flux-system")' -
      | kubectl apply --server-side --field-manager=kustomize-controller --filename -
    requires:
      vars: [PATH]
    vars:
      KS:
        sh: flux --namespace flux-system get kustomizations {{base .PATH}} 2>&1
    preconditions:
      - test -f {{.KUBERNETES_DIR}}/apps/{{.PATH}}/ks.yaml
      - which flux kubectl yq

  reconcile:
    desc: Force update Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization cluster --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux

  kubeconform:
    desc: Validate Kubernetes manifests with kubeconform
    cmd: bash {{.KUBECONFORM_SCRIPT}} {{.KUBERNETES_DIR}}
    preconditions:
      - test -f {{.KUBECONFORM_SCRIPT}}
      - which kubeconform

  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: RESOURCE }
        cmd: kubectl get {{.ITEM}} {{.CLI_ARGS | default "-A"}}
    vars:
      RESOURCE: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        ingresses
        pods
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  crd-drift:
    desc: Report CRDs whose status.storedVersions contain versions no longer served
    # A CRD keeps every version it has ever used as a storage version in
    # status.storedVersions. When a chart upgrade drops one from spec.versions,
    # the API server rejects the apply and the owning Kustomization silently
    # stops reconciling. On 2026-08-09 this had stopped Flux managing its own
    # components (imagepolicies/imagerepositories/imageupdateautomations, all
    # with v1beta2 stranded) and blocked the emqx operator rollback (emqxes/v2).
    # Nothing surfaces it until something forces a re-apply, so check it after
    # chart upgrades and before/after any full restart.
    cmds:
      - |
        kubectl get crd -o json | jq -r '
          .items[] | . as $c
          | ($c.spec.versions | map(.name)) as $spec
          | (($c.status.storedVersions // []) - $spec) as $orphan
          | select($orphan | length > 0)
          | "DRIFT \($c.metadata.name)\n  served:  \($spec | join(", "))\n  stored:  \($c.status.storedVersions | join(", "))\n  orphan:  \($orphan | join(", "))"
        '
      - |
        echo "--- CRDs whose stored versions are a strict subset of served (healthy) are not listed."
        echo "--- Any DRIFT above blocks the owning chart from applying that CRD."
        echo "--- Before narrowing storedVersions, CONFIRM the object count for the dying"
        echo "--- version is zero, or migrate first. See docs/runbooks/full-cluster-shutdown.md"
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl jq
